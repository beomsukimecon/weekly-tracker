<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VOCA</title>
<style>
  :root { color-scheme: light;
    --bg:#f6f5f1; --card:#fff; --ink:#1f2328; --muted:#6b7280; --line:#e5e3dc;
    --accent:#b45309; --accent-soft:#fef3e2; --green:#15803d; --blue:#1d4ed8; --blue-soft:#eff6ff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Segoe UI",sans-serif;
    font-size:15px; line-height:1.5; }
  .wrap { max-width:640px; margin:0 auto; padding:14px 12px 60px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:12px; }
  h2 { margin:0 0 10px; font-size:17px; }
  h3 { margin:0 0 8px; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); display:flex; align-items:center; gap:8px; }
  h3 .cnt { font-weight:400; }
  button.btn, label.btn { border:1px solid var(--line); background:#fbfaf7; color:var(--ink);
    border-radius:9px; padding:9px 13px; font-size:14px; cursor:pointer; display:inline-block; }
  button.btn:disabled { opacity:.45; }
  button.btn.danger { color:#b91c1c; }
  .seg { display:flex; gap:6px; margin-bottom:12px; }
  .seg .btn { flex:1; text-align:center; }
  .segbtn.on { background:var(--accent-soft); border-color:var(--accent); font-weight:700; }
  .vrow { display:flex; gap:8px; flex-wrap:wrap; }
  .vrow input, input.vlong { border:1px solid var(--line); border-radius:9px; padding:9px 11px; font-size:15px; background:#fbfaf7; outline:none; color:var(--ink); }
  .vrow input { flex:1; min-width:120px; }
  .vrow input:focus, input.vlong:focus { border-color:var(--accent); }
  input.vlong { width:100%; margin-top:6px; }
  input.vnum { width:64px; flex:0 0 64px !important; min-width:64px !important; }
  select.vsortsel { border:1px solid var(--line); border-radius:9px; padding:8px; font-size:13.5px; background:#fbfaf7; color:var(--ink); outline:none; flex:0 0 auto; }
  .hint { font-size:12px; color:var(--muted); margin:6px 0 0; }
  .ventry { padding:8px 4px; border-bottom:1px solid var(--line); }
  .vtop { display:flex; gap:8px; align-items:baseline; flex-wrap:wrap; }
  .vtop .vm { color:var(--muted); flex:1; min-width:120px; }
  .vtop input[type=checkbox] { accent-color:var(--accent); width:16px; height:16px; align-self:center; flex-shrink:0; }
  .vex { font-size:13px; color:var(--muted); font-style:italic; margin-top:3px; }
  .vwrong { color:#b91c1c; font-size:12px; font-weight:700; }
  .vdaytag { font-size:11px; color:var(--accent); font-weight:700; flex-shrink:0; }
  .vsm { padding:3px 9px; font-size:12px; flex-shrink:0; }
  .empty { color:var(--muted); font-size:14px; padding:8px 0; }
  .quiz { background:var(--blue-soft); border-radius:12px; padding:14px; }
  .quiz h3 { color:var(--blue); }
  .qword { font-size:26px; font-weight:700; margin:12px 0; }
  .qmean { font-size:16px; margin-bottom:6px; }
  .qex { font-size:13.5px; color:var(--muted); font-style:italic; margin-bottom:12px; }
  .qopt { display:block; width:100%; text-align:left; margin-top:7px; padding:11px 13px; font-size:15px; background:#fff; }
  .qopt.correct { background:#ecfdf3; border-color:var(--green); font-weight:700; }
  .qopt.wrongpick { background:#fef2f2; border-color:#b91c1c; }
  .sync { font-size:12.5px; color:var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h2>VOCA <span class="sync" id="syncMsg"></span></h2>
    <div class="seg" id="seg"></div>
    <div id="main"></div>
  </div>
</div>

<script>
const LS_KEY = "vocaApp.v1";
const VCATS = [["gre","GRE"],["toefl","TOEFL"],["writing","Writing"]];
// 저장소에 올려둔 CSV — 페이지 열 때 자동으로 불러와 병합 (중복 제외)
const SYNC_FILES = ["GRE.csv","TOEFL.csv","writing.csv","voca_gre.csv","voca_toefl.csv","voca_writing.csv"];

let state = { vocab:{gre:[],toefl:[],writing:[]}, vday:1 };
try { const s = JSON.parse(localStorage.getItem(LS_KEY)); if (s && s.vocab) state = Object.assign(state, s); } catch(e){}
function save(){ try { localStorage.setItem(LS_KEY, JSON.stringify(state)); return true; } catch(e){ return false; } }

let vcat="gre", quiz=null, vedit=null, vsel=new Set(), vsort="new", vfilter=0, qmode="mc";

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function csvEscape(x){ return '"' + String(x==null?"":x).replace(/"/g,'""') + '"'; }
function parseCSV(text){
  const rows=[]; let row=[], cell="", inQ=false;
  text = text.replace(/^﻿/,"");
  for (let i=0;i<text.length;i++){ const c=text[i];
    if (inQ){ if (c==='"'){ if (text[i+1]==='"'){ cell+='"'; i++; } else inQ=false; } else cell+=c; }
    else if (c==='"') inQ=true;
    else if (c===",") { row.push(cell); cell=""; }
    else if (c==="\n"||c==="\r"){ if (c==="\r"&&text[i+1]==="\n") i++;
      row.push(cell); cell=""; if (row.some(x=>x.trim()!=="")) rows.push(row); row=[]; }
    else cell+=c; }
  row.push(cell); if (row.some(x=>x.trim()!=="")) rows.push(row);
  return rows;
}
function importRows(rows, cat){
  const h0=(rows[0] && rows[0][0]||"").toLowerCase().trim();
  if (h0==="day"||h0==="일차"||h0==="word"||h0==="단어"||h0==="voca") rows=rows.slice(1);
  const existing={};
  state.vocab[cat].forEach(x=>{ existing[x.w.toLowerCase().trim()]=true; });
  let n=0;
  rows.forEach(row=>{
    let d=1, off=0;
    if (/^\s*\d+\s*$/.test(row[0]||"")){ d=parseInt(row[0]); off=1; }
    const w=(row[off]||"").trim();
    if (!w||existing[w.toLowerCase()]) return;
    existing[w.toLowerCase()]=true;
    state.vocab[cat].push({ d:d, w:w, m:(row[off+1]||"").trim(), ex:(row[off+2]||"").trim(), ext:(row[off+3]||"").trim(), wrong:parseInt(row[off+4])||0 });
    n++;
  });
  return n;
}
async function syncFromRepo(){
  let added=0, ok=0;
  for (const f of SYNC_FILES){
    try {
      const r = await fetch(f, {cache:"no-store"});
      if (!r.ok) continue;
      const text = await r.text();
      if (text.trim().startsWith("<")) continue; // 404 페이지 방어
      const fl = f.toLowerCase();
      const cat = fl.indexOf("gre")>=0?"gre":fl.indexOf("toefl")>=0?"toefl":fl.indexOf("writing")>=0?"writing":vcat;
      const rows = parseCSV(text);
      if (rows.length){ added += importRows(rows, cat); ok++; }
    } catch(e){}
  }
  if (ok){ save();
    document.getElementById("syncMsg").textContent = added ? "· 동기화 +" + added + "단어" : "· 동기화됨";
    render(); }
}

function buildQuizChoices(it){
  const key = quiz.mode==="mc"?"m":"w";
  const correct = it[key];
  let pool = Array.from(new Set(state.vocab[vcat].map(x=>x[key]).filter(v=>v&&v!==correct)));
  for (let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=pool[i];pool[i]=pool[j];pool[j]=t; }
  const ch=[correct].concat(pool.slice(0,3));
  for (let i=ch.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=ch[i];ch[i]=ch[j];ch[j]=t; }
  quiz.choices=ch; quiz.answer=ch.indexOf(correct);
}
function getVList(){
  const words=state.vocab[vcat];
  let list=words.map((it,idx)=>({it:it,idx:idx}));
  if (vfilter>0) list=list.filter(p=>(p.it.d||1)===vfilter);
  if (vsort==="new") list.reverse();
  else if (vsort==="dayasc") list.sort((a,b)=>(a.it.d||1)-(b.it.d||1));
  else if (vsort==="daydesc") list.sort((a,b)=>(b.it.d||1)-(a.it.d||1));
  else if (vsort==="abc") list.sort((a,b)=>a.it.w.localeCompare(b.it.w,"en",{sensitivity:"base"}));
  else if (vsort==="wrong") list.sort((a,b)=>(b.it.wrong||0)-(a.it.wrong||0));
  return list;
}

function render(){
  const seg=document.getElementById("seg");
  seg.innerHTML="";
  VCATS.forEach(c=>{
    const b=document.createElement("button");
    b.className="btn segbtn"+(vcat===c[0]?" on":"");
    b.textContent=c[1]+" ("+state.vocab[c[0]].length+")";
    b.onclick=()=>{ vcat=c[0]; quiz=null; vedit=null; vsel=new Set(); vfilter=0; render(); };
    seg.appendChild(b);
  });

  const main=document.getElementById("main");
  const words=state.vocab[vcat];
  let h="";

  if (quiz){
    if (quiz.i>=quiz.order.length){
      h+='<div class="quiz"><h3>결과</h3><p style="font-size:18px"><b>'+quiz.right+' / '+quiz.order.length+'</b> 맞음</p>';
      if (quiz.wrong.length){
        h+='<p style="margin:4px 0"><b>틀린 단어:</b></p>';
        quiz.wrong.forEach(i=>{ const it=words[i];
          if (it) h+='<div class="ventry"><div class="vtop"><b>'+esc(it.w)+'</b><span class="vm">'+esc(it.m)+'</span></div></div>'; });
      }
      h+='<button class="btn" id="qdone" style="margin-top:10px">닫기</button></div>';
    } else {
      const it=words[quiz.order[quiz.i]];
      h+='<div class="quiz"><h3>테스트 '+(quiz.i+1)+' / '+quiz.order.length+
        ' <span class="cnt">('+quiz.from+'~'+quiz.to+'일차)</span>'+
        '<button class="btn vsm" id="qquit" style="margin-left:auto">그만</button></h3>';
      if (quiz.mode==="flash"){
        h+='<div class="qword">'+esc(it.w)+' <span class="vdaytag">'+(it.d||1)+'일차</span></div>';
        if (quiz.show){
          h+='<div class="qmean">'+esc(it.m)+'</div>'+
            (it.ex?'<div class="qex">'+esc(it.ex)+(it.ext?'<br>'+esc(it.ext):"")+'</div>':"")+
            '<button class="btn" id="qo">알았음 O</button> <button class="btn danger" id="qx">몰랐음 X</button>';
        } else h+='<button class="btn" id="qshow">뜻 보기</button>';
      } else {
        if (!quiz.choices) buildQuizChoices(it);
        const prompt = quiz.mode==="mc"?it.w:it.m;
        h+='<div class="qword" style="font-size:'+(quiz.mode==="mc"?"26px":"18px")+'">'+esc(prompt)+' <span class="vdaytag">'+(it.d||1)+'일차</span></div>';
        quiz.choices.forEach((c,ci)=>{
          let cls="btn qopt";
          if (quiz.picked!==null){ if (ci===quiz.answer) cls+=" correct"; else if (ci===quiz.picked) cls+=" wrongpick"; }
          h+='<button class="'+cls+'" data-ci="'+ci+'">'+(ci+1)+'. '+esc(c)+'</button>';
        });
        if (quiz.picked!==null){
          h+='<div class="qmean" style="margin-top:10px">'+(quiz.picked===quiz.answer?"⭕ 정답":"❌ 오답")+'</div>'+
            (it.ex?'<div class="qex">'+esc(it.ex)+(it.ext?'<br>'+esc(it.ext):"")+'</div>':"")+
            '<button class="btn" id="qnext">다음 →</button>';
        }
      }
      h+='</div>';
    }
    main.innerHTML=h; bindQuiz(); return;
  }

  // 테스트 설정
  const days=words.map(it=>it.d||1);
  const minD=days.length?Math.min.apply(null,days):1;
  const maxD=days.length?Math.max.apply(null,days):1;
  h+='<div style="margin-bottom:16px"><h3>테스트</h3><div class="vrow" style="align-items:center">'+
    '<span style="flex:0 0 auto;font-size:13px">일차</span>'+
    '<input id="qfrom" class="vnum" type="number" min="1" value="'+minD+'">'+
    '<span style="flex:0 0 auto">~</span>'+
    '<input id="qto" class="vnum" type="number" min="1" value="'+maxD+'">'+
    '<select id="qmode" class="vsortsel">'+
    '<option value="mc"'+(qmode==="mc"?" selected":"")+'>뜻 고르기</option>'+
    '<option value="mcr"'+(qmode==="mcr"?" selected":"")+'>단어 고르기</option>'+
    '<option value="flash"'+(qmode==="flash"?" selected":"")+'>플래시카드</option>'+
    '</select>'+
    '<button class="btn" id="vtest"'+(words.length?"":" disabled")+' style="flex:1">테스트 시작</button></div></div>';

  // 단어 추가
  h+='<div style="margin-bottom:16px"><h3>단어 추가</h3><div class="vrow">'+
    '<input id="vd" class="vnum" type="number" min="1" placeholder="일차" value="'+(state.vday||1)+'">'+
    '<input id="vw" placeholder="단어"><input id="vm" placeholder="뜻">'+
    '<button class="btn" id="vadd">추가</button></div>'+
    '<input id="vex" class="vlong" placeholder="예문 (선택)">'+
    '<input id="vext" class="vlong" placeholder="예문 해석 (선택)"></div>';

  // CSV
  h+='<div style="margin-bottom:16px"><div class="vrow">'+
    '<button class="btn" id="vcsv"'+(words.length?"":" disabled")+'>CSV 내보내기</button>'+
    '<label class="btn">CSV 불러오기<input type="file" id="vimp" accept=".csv" hidden></label></div></div>';

  // 단어장
  const list=getVList();
  const uniqDays=Array.from(new Set(words.map(it=>it.d||1))).sort((a,b)=>a-b);
  h+='<div><h3>단어장 <span class="cnt">'+(vfilter>0?list.length+"/"+words.length:words.length)+'</span></h3>';
  if (!words.length) h+='<div class="empty">아직 없음. 위에서 추가하거나 CSV를 불러올 것.</div>';
  else {
    h+='<div class="vrow" style="margin-bottom:8px">'+
      '<select id="vfilter" class="vsortsel"><option value="0"'+(vfilter===0?" selected":"")+'>전체 보기</option>';
    uniqDays.forEach(dd=>{ h+='<option value="'+dd+'"'+(vfilter===dd?" selected":"")+'>'+dd+'일차만</option>'; });
    h+='</select><select id="vsort" class="vsortsel">'+
      '<option value="new"'+(vsort==="new"?" selected":"")+'>최신순</option>'+
      '<option value="dayasc"'+(vsort==="dayasc"?" selected":"")+'>일차 ↑</option>'+
      '<option value="daydesc"'+(vsort==="daydesc"?" selected":"")+'>일차 ↓</option>'+
      '<option value="abc"'+(vsort==="abc"?" selected":"")+'>ABC순</option>'+
      '<option value="wrong"'+(vsort==="wrong"?" selected":"")+'>많이 틀린 순</option>'+
      '</select>'+
      '<button class="btn vsm" id="vselall">'+(list.length&&vsel.size===list.length?"전체해제":"전체선택")+'</button>'+
      '<button class="btn vsm danger" id="vdelsel"'+(vsel.size?"":" disabled")+'>선택 삭제 ('+vsel.size+')</button></div>';
    if (vfilter>0&&!list.length) h+='<div class="empty">'+vfilter+'일차 단어가 없음.</div>';
  }
  list.forEach(pair=>{
    const it=pair.it, idx=pair.idx;
    if (vedit===idx){
      h+='<div class="ventry" style="background:#faf9f5;border-radius:10px"><div class="vrow">'+
        '<input id="ved" class="vnum" type="number" min="1" value="'+(it.d||1)+'">'+
        '<input id="vew" value="'+esc(it.w)+'" placeholder="단어"><input id="vem" value="'+esc(it.m)+'" placeholder="뜻"></div>'+
        '<input id="veex" class="vlong" value="'+esc(it.ex||"")+'" placeholder="예문">'+
        '<input id="veext" class="vlong" value="'+esc(it.ext||"")+'" placeholder="예문 해석">'+
        '<div class="vrow" style="margin-top:6px"><button class="btn vsm" id="vesave">저장</button>'+
        '<button class="btn vsm" id="vecancel">취소</button></div></div>';
    } else {
      h+='<div class="ventry"><div class="vtop">'+
        '<input type="checkbox" class="vselbox" data-i="'+idx+'"'+(vsel.has(idx)?" checked":"")+'>'+
        '<span class="vdaytag">'+(it.d||1)+'일차</span><b>'+esc(it.w)+'</b><span class="vm">'+esc(it.m)+'</span>'+
        (it.wrong?'<span class="vwrong">×'+it.wrong+'</span>':"")+
        '<button class="btn vsm vedit2" data-i="'+idx+'">수정</button>'+
        '<button class="btn vsm vdel" data-i="'+idx+'">삭제</button></div>'+
        (it.ex?'<div class="vex">'+esc(it.ex)+(it.ext?'<br>'+esc(it.ext):"")+'</div>':"")+
        '</div>';
    }
  });
  h+='</div>';
  main.innerHTML=h;
  bindMain();
}

function bindQuiz(){
  const main=document.getElementById("main");
  const words=state.vocab[vcat];
  const q=id=>main.querySelector(id);
  main.querySelectorAll(".qopt").forEach(b=>{
    b.onclick=()=>{
      if (quiz.picked!==null) return;
      quiz.picked=+b.dataset.ci;
      const idx=quiz.order[quiz.i];
      if (quiz.picked===quiz.answer) quiz.right++;
      else { words[idx].wrong=(words[idx].wrong||0)+1; quiz.wrong.push(idx); save(); }
      render();
    };
  });
  if (q("#qnext")) q("#qnext").onclick=()=>{ quiz.i++; quiz.choices=null; quiz.picked=null; render(); };
  if (q("#qshow")) q("#qshow").onclick=()=>{ quiz.show=true; render(); };
  if (q("#qo")) q("#qo").onclick=()=>{ quiz.right++; quiz.i++; quiz.show=false; render(); };
  if (q("#qx")) q("#qx").onclick=()=>{
    const idx=quiz.order[quiz.i];
    words[idx].wrong=(words[idx].wrong||0)+1;
    quiz.wrong.push(idx); quiz.i++; quiz.show=false; save(); render();
  };
  if (q("#qquit")) q("#qquit").onclick=()=>{ quiz=null; render(); };
  if (q("#qdone")) q("#qdone").onclick=()=>{ quiz=null; render(); };
}

function bindMain(){
  const main=document.getElementById("main");
  const words=state.vocab[vcat];
  const q=id=>main.querySelector(id);

  if (q("#qmode")) q("#qmode").onchange=e=>{ qmode=e.target.value; };
  if (q("#vtest")) q("#vtest").onclick=()=>{
    const from=Math.max(1,parseInt(q("#qfrom").value)||1);
    const to=Math.max(from,parseInt(q("#qto").value)||from);
    const order=[];
    words.forEach((it,i)=>{ const dd=it.d||1; if (dd>=from&&dd<=to) order.push(i); });
    if (!order.length){ alert(from+"~"+to+"일차 단어가 없음."); return; }
    if (qmode!=="flash"){
      const key=qmode==="mc"?"m":"w";
      if (new Set(words.map(x=>x[key]).filter(Boolean)).size<4){ alert("4지선다는 단어가 4개 이상 필요함."); return; }
    }
    for (let i=order.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=order[i];order[i]=order[j];order[j]=t; }
    quiz={ mode:qmode, order:order, i:0, show:false, right:0, wrong:[], from:from, to:to, choices:null, picked:null };
    render();
  };

  if (q("#vadd")){
    const add=()=>{
      const dnum=Math.max(1,parseInt(q("#vd").value)||1);
      const w=q("#vw").value.trim(), m=q("#vm").value.trim();
      const ex=q("#vex").value.trim(), ext=q("#vext").value.trim();
      if (!w) return;
      state.vocab[vcat].push({d:dnum,w:w,m:m,ex:ex,ext:ext,wrong:0});
      state.vday=dnum; save(); render();
      setTimeout(()=>{ const el=document.querySelector("#vw"); if (el) el.focus(); },0);
    };
    q("#vadd").onclick=add;
    ["vd","vw","vm","vex","vext"].forEach(id=>{
      q("#"+id).onkeydown=e=>{
        if (e.key!=="Enter") return;
        if (id==="vd") q("#vw").focus();
        else if (id==="vw") q("#vm").focus();
        else add();
      };
    });
  }

  if (q("#vcsv")) q("#vcsv").onclick=()=>{
    const rows=[["day","word","meaning","example","example_translation","wrong_count"]];
    words.forEach(it=>rows.push([it.d||1,it.w,it.m,it.ex||"",it.ext||"",it.wrong||0]));
    const csv="﻿"+rows.map(r=>r.map(csvEscape).join(",")).join("\r\n");
    const a=document.createElement("a");
    a.href="data:text/csv;charset=utf-8,"+encodeURIComponent(csv);
    a.download="voca_"+vcat+".csv"; a.click();
  };
  if (q("#vimp")) q("#vimp").onchange=e=>{
    const file=e.target.files[0]; if (!file) return;
    const r=new FileReader();
    r.onload=()=>{
      const rows=parseCSV(r.result);
      if (!rows.length){ alert("빈 파일임."); return; }
      const n=importRows(rows,vcat);
      save(); render();
      alert(n+"개 추가함 (중복 제외).");
    };
    r.readAsText(file);
  };

  if (q("#vsort")) q("#vsort").onchange=e=>{ vsort=e.target.value; render(); };
  if (q("#vfilter")) q("#vfilter").onchange=e=>{ vfilter=parseInt(e.target.value)||0; vsel=new Set(); render(); };
  main.querySelectorAll(".vselbox").forEach(cb=>{
    cb.onchange=()=>{ const i=+cb.dataset.i; if (cb.checked) vsel.add(i); else vsel.delete(i); render(); };
  });
  if (q("#vselall")) q("#vselall").onclick=()=>{
    const vis=getVList().map(p=>p.idx);
    if (vis.length&&vsel.size===vis.length) vsel=new Set(); else vsel=new Set(vis);
    render();
  };
  if (q("#vdelsel")) q("#vdelsel").onclick=()=>{
    if (!vsel.size) return;
    if (!confirm("선택한 "+vsel.size+"개 단어를 삭제할까?")) return;
    state.vocab[vcat]=words.filter((_,i)=>!vsel.has(i));
    vsel=new Set(); vedit=null; save(); render();
  };
  main.querySelectorAll(".vdel").forEach(b=>{
    b.onclick=()=>{ state.vocab[vcat].splice(+b.dataset.i,1); vsel=new Set(); vedit=null; save(); render(); };
  });
  main.querySelectorAll(".vedit2").forEach(b=>{
    b.onclick=()=>{ vedit=+b.dataset.i; render(); };
  });
  if (q("#vesave")){
    const commitEdit=()=>{
      const it=state.vocab[vcat][vedit];
      if (!it){ vedit=null; render(); return; }
      const w=q("#vew").value.trim();
      if (!w){ alert("단어는 비울 수 없음."); return; }
      it.d=Math.max(1,parseInt(q("#ved").value)||1);
      it.w=w; it.m=q("#vem").value.trim();
      it.ex=q("#veex").value.trim(); it.ext=q("#veext").value.trim();
      vedit=null; save(); render();
    };
    q("#vesave").onclick=commitEdit;
    q("#vecancel").onclick=()=>{ vedit=null; render(); };
    ["ved","vew","vem","veex","veext"].forEach(id=>{
      const el=q("#"+id);
      if (el) el.onkeydown=e=>{ if (e.key==="Enter") commitEdit(); else if (e.key==="Escape"){ vedit=null; render(); } };
    });
  }
}

render();
syncFromRepo();
</script>
</body>
</html>
