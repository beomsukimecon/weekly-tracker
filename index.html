<style>
/* Layout: teleprompter column — slide strip on top, script in the middle, one play bar pinned to the bottom. */
:root{
  --bg:#f3f4f1; --paper:#fbfbf9; --ink:#1d2321; --mute:#6c7470; --line:#d9ddd8;
  --accent:#1f6b5c; --accent-soft:#dcebe6; --now:#fff6d6;
  --f-read:"Source Serif 4", Georgia, serif;
  --f-ui:"IBM Plex Sans KR", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141917; --paper:#1b211f; --ink:#e6ebe8; --mute:#94a09a; --line:#2c3532;
  --accent:#6cc4ae; --accent-soft:#1f3a33; --now:#2f2b18; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141917; --paper:#1b211f; --ink:#e6ebe8; --mute:#94a09a; --line:#2c3532;
  --accent:#6cc4ae; --accent-soft:#1f3a33; --now:#2f2b18; color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);margin:0}
.wrap{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:0 150px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding-block:14px 8px;border-bottom:1px solid var(--line)}
h1{font-family:var(--f-read);font-weight:600;font-size:1.15rem;margin:0 0 2px;text-wrap:balance}
.sub{color:var(--mute);font-size:.8rem}
.strip{display:flex;gap:6px;overflow-x:auto;padding-block:10px 2px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;font-family:var(--f-mono);font-size:.75rem;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:6px;padding:5px 8px;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.chip.done{color:var(--mute)}
section{padding-block:22px 6px;border-bottom:1px dashed var(--line)}
.sh{display:flex;gap:10px;align-items:baseline;margin-bottom:10px;cursor:pointer}
.sn{font-family:var(--f-mono);font-size:.75rem;color:var(--accent);letter-spacing:.04em}
.st{font-family:var(--f-ui);font-weight:600;font-size:.9rem}
.sd{margin-left:auto;font-family:var(--f-mono);font-size:.72rem;color:var(--mute);font-variant-numeric:tabular-nums}
p{font-family:var(--f-read);font-size:1.06rem;line-height:1.62;margin:0 0 .7em;padding:4px 8px;margin-inline:-8px;border-radius:6px;cursor:pointer;transition:background .25s}
p.now{background:var(--now)}
p sub{font-size:.7em}
.silent{color:var(--mute);font-style:italic;font-size:.9rem}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));z-index:10}
.bi{max-width:680px;margin:0 auto;display:grid;gap:8px}
.prog{height:22px;position:relative;cursor:pointer}
.prog::before{content:"";position:absolute;left:0;right:0;top:9px;height:4px;border-radius:2px;background:var(--line)}
.fill{position:absolute;left:0;top:9px;height:4px;border-radius:2px;background:var(--accent);width:0}
.row{display:flex;align-items:center;gap:10px}
.tm{font-family:var(--f-mono);font-size:.78rem;color:var(--mute);font-variant-numeric:tabular-nums;min-width:0}
button.ctl{font-family:var(--f-ui);border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;height:40px;min-width:44px;font-size:.95rem;cursor:pointer}
button.play{background:var(--accent);border-color:var(--accent);color:var(--paper);width:56px;height:46px;border-radius:23px;font-size:1.1rem}
button:focus-visible,.chip:focus-visible,p:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sp{margin-left:auto;font-family:var(--f-mono);font-size:.82rem}
@media (prefers-reduced-motion: reduce){p{transition:none}}

/* --- tabs --- */
.tabs{display:flex;gap:4px;margin-top:10px;background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:3px}
.tab{flex:1;font-family:var(--f-ui);font-size:.85rem;font-weight:500;border:0;background:transparent;color:var(--mute);padding:7px 4px;border-radius:7px;cursor:pointer}
.tab.on{background:var(--accent);color:var(--paper)}
.hint{color:var(--mute);font-size:.8rem;line-height:1.5;margin:14px 0 4px}

/* --- memorize: slide picker --- */
.mchip{display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 7px 4px}
.dots{display:flex;gap:2px}
.dots i{width:4px;height:4px;border-radius:2px;background:var(--line)}
.dots i.f{background:var(--accent)}
.chip.on .dots i{background:color-mix(in srgb,var(--paper) 35%,transparent)}
.chip.on .dots i.f{background:var(--paper)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:14px}
.ch{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.lv{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:14px 0 6px}
.lvb{font-family:var(--f-ui);font-size:.78rem;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:7px;padding:7px 2px;cursor:pointer;line-height:1.25}
.lvb small{display:block;font-family:var(--f-mono);font-size:.66rem;color:var(--mute)}
.lvb.on{border-color:var(--accent);background:var(--accent-soft)}
.lvb.ok small{color:var(--accent)}
.mp{display:flex;gap:8px;align-items:flex-start;margin-top:12px}
.pb{flex:0 0 auto;width:30px;height:30px;border-radius:15px;border:1px solid var(--line);background:var(--bg);color:var(--accent);font-size:.7rem;cursor:pointer;margin-top:3px}
.pb.on{background:var(--accent);color:var(--paper);border-color:var(--accent)}
.mt{flex:1;min-width:0;font-family:var(--f-read);font-size:1.04rem;line-height:1.7;padding:2px 8px;border-radius:6px;cursor:pointer}
.mt.open{background:var(--now)}
.w{white-space:nowrap}
.gap{display:inline-block;height:.12em;background:var(--mute);opacity:.45;vertical-align:baseline;margin-left:1px;border-radius:1px}
.w.show .gap{display:none}
.w .rest{display:none}
.w.show .rest{display:inline}
.cue{color:var(--mute);font-style:italic}
.blank{color:var(--mute);font-family:var(--f-ui);font-size:.85rem;border:1px dashed var(--line);border-radius:6px;padding:8px 10px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.btn{font-family:var(--f-ui);font-size:.88rem;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:9px 12px;cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.rate .btn{padding:10px 4px}
.nav2{display:flex;justify-content:space-between;margin-top:14px}
.ctx{font-family:var(--f-read);font-size:.95rem;line-height:1.6;color:var(--mute);border-left:2px solid var(--line);padding-left:10px;margin:12px 0}
.ctx b{font-family:var(--f-ui);font-size:.72rem;font-weight:500;letter-spacing:.04em;display:block;margin-bottom:2px}
.ans{font-family:var(--f-read);font-size:1.08rem;line-height:1.65;background:var(--now);border-radius:8px;padding:10px 12px;margin-top:10px}
.score{font-family:var(--f-mono);font-size:.78rem;color:var(--mute);font-variant-numeric:tabular-nums}
</style>

<script>
const SECS = [{"id": "S1", "num": "1", "title": "Title", "paras": [{"show": "Good morning. I’m Beomsu kim, a graduate student at Sogang University.", "say": "Good morning. I'm Bum-soo Kim, a graduate student at Sogang University."}, {"show": "Today, I’ll present our paper, Sensitivity Analysis in Sharp Regression Discontinuity Designs.", "say": "Today, I'll present our paper, Sensitivity Analysis in Sharp Regression Discontinuity Designs."}]}, {"id": "S2", "num": "2", "title": "Introduction", "paras": [{"show": "In a sharp regression discontinuity design, treatment is assigned when a running variable exceeds a known cutoff.", "say": "In a sharp regression discontinuity design, treatment is assigned when a running variable exceeds a known cutoff."}, {"show": "Under standard identifying assumptions, the RD design identifies a causal treatment effect at the cutoff.", "say": "Under standard identifying assumptions, the R-D design identifies a causal treatment effect at the cutoff."}, {"show": "For example, consider a high-school admission setting, where students above an admission-score cutoff are assigned to a better high school. We may be interested in how this assignment affects their later exam scores.", "say": "For example, consider a high-school admission setting, where students above an admission-score cutoff are assigned to a better high school. We may be interested in how this assignment affects their later exam scores."}, {"show": "A conventional RD identifies this effect for students at the admission cutoff.", "say": "A conventional R-D identifies this effect for students at the admission cutoff."}]}, {"id": "S3", "num": "3", "title": "Introduction", "paras": [{"show": "However, empirical questions may concern treatment effects beyond the cutoff.", "say": "However, empirical questions may concern treatment effects beyond the cutoff."}, {"show": "We may be interested in effects for subpopulations at other values of the running variable, or for the overall population.", "say": "We may be interested in effects for subpopulations at other values of the running variable, or for the overall population."}, {"show": "In the school example, we may want to know the effect for students with admission scores away from the cutoff, or for all students. These effects may differ from the cutoff effect because treatment effects can vary with the admission score.", "say": "In the school example, we may want to know the effect for students with admission scores away from the cutoff, or for all students. These effects may differ from the cutoff effect because treatment effects can vary with the admission score."}, {"show": "The challenge is that, without further assumptions, these effects are not identified.", "say": "The challenge is that, without further assumptions, these effects are not identified."}, {"show": "For students below the cutoff, we do not observe their potential outcomes under assignment to the better school. For students above the cutoff, we do not observe their potential outcomes without that assignment.", "say": "For students below the cutoff, we do not observe their potential outcomes under assignment to the better school. For students above the cutoff, we do not observe their potential outcomes without that assignment."}]}, {"id": "S4", "num": "4", "title": "This Paper", "paras": [{"show": "To address this problem, we provide a framework for extrapolating treatment effects beyond the cutoff in sharp RD designs.", "say": "To address this problem, we provide a framework for extrapolating treatment effects beyond the cutoff in sharp R-D designs."}, {"show": "The key idea is to impose a smoothness assumption that the conditional distribution of each potential outcome does not change too sharply with the running variable.", "say": "The key idea is to impose a smoothness assumption that the conditional distribution of each potential outcome does not change too sharply with the running variable."}, {"show": "Importantly, this approach does not require any additional variables.", "say": "Importantly, this approach does not require any additional variables."}, {"show": "In the school example, if two groups have similar admission scores, their later exam score distributions should be similar, both under assignment to the better school and under non-assignment.", "say": "In the school example, if two groups have similar admission scores, their later exam score distributions should be similar, both under assignment to the better school and under non-assignment."}, {"show": "Using this smoothness assumption, we derive sharp bounds on the counterfactual distributions.", "say": "Using this smoothness assumption, we derive sharp bounds on the counterfactual distributions."}, {"show": "Finally, by varying the degree of smoothness, we can assess the sensitivity of the bounds.", "say": "Finally, by varying the degree of smoothness, we can assess the sensitivity of the bounds."}]}, {"id": "S5", "num": "5", "title": "This Paper", "paras": [{"show": "Because we bound counterfactual distributions, our framework allows us to study both distributional and mean treatment effects.", "say": "Because we bound counterfactual distributions, our framework allows us to study both distributional and mean treatment effects."}, {"show": "We then revisit the Romanian high-school application of Pop-Eleches and Urquiola.", "say": "We then revisit the Romanian high-school application of Pop Eh-leh-kess and Oor-kee-oh-la."}, {"show": "Our results suggest that effects away from the cutoff and for the overall population may differ from the cutoff effect, particularly for distributional effects.", "say": "Our results suggest that effects away from the cutoff and for the overall population may differ from the cutoff effect, particularly for distributional effects."}]}, {"id": "S6", "num": "6", "title": "Related Work", "paras": [{"show": "Because of the time limit, I’ll skip this part.", "say": "Because of the time limit, I'll skip this part."}]}, {"id": "S7", "num": "7", "title": "Model and Identification", "paras": [{"show": "Let me now turn to the model and identification.", "say": "Let me now turn to the model and identification."}]}, {"id": "S8", "num": "8", "title": "Model", "paras": [{"show": "Let <i>R</i> denote the running variable and <i>c</i> the cutoff.", "say": "Let R denote the running variable and c the cutoff."}, {"show": "Treatment is assigned when <i>R</i> is at least <i>c</i>.", "say": "Treatment is assigned when R is at least c."}, {"show": "Let Y<sub>1</sub> and Y<sub>0</sub> denote the potential outcomes under treatment and control.", "say": "Let Y one and Y zero denote the potential outcomes under treatment and control."}, {"show": "We observe Y<sub>1</sub> in the treated region, ℛ<sub>1</sub>, and Y<sub>0</sub> in the control region, ℛ<sub>0</sub>.", "say": "We observe Y one in the treated region, R one, and Y zero in the control region, R zero."}, {"show": "Let F<sub>Y<sub>d</sub>|R</sub> denote the conditional distribution of the potential outcome Y<sub>d</sub>. In words, this is the outcome distribution for the subpopulation with the running variable equal to <i>r</i>.", "say": "Let F of Y d given R denote the conditional distribution of the potential outcome Y d. In words, this is the outcome distribution for the subpopulation with the running variable equal to r."}, {"show": "Our identification targets are the counterfactual distributions on the opposite side of the cutoff.", "say": "Our identification targets are the counterfactual distributions on the opposite side of the cutoff."}, {"show": "So, in the control region, we want to learn the distribution of Y<sub>1</sub>, and in the treated region, we want to learn the distribution of Y<sub>0</sub>.", "say": "So, in the control region, we want to learn the distribution of Y one, and in the treated region, we want to learn the distribution of Y zero."}]}, {"id": "S9", "num": "9", "title": "Smoothness Assumption", "paras": [{"show": "To learn about the unobserved counterfactual distributions, we impose the following assumption.", "say": "To learn about the unobserved counterfactual distributions, we impose the following assumption."}, {"show": "First, on the side where each potential outcome is observed, its distribution is identified from the data. This provides the starting point for extrapolation.", "say": "First, on the side where each potential outcome is observed, its distribution is identified from the data. This provides the starting point for extrapolation."}, {"show": "Second, our main assumption is smoothness.", "say": "Second, our main assumption is smoothness."}, {"show": "Take any two values in the support of the running variable. At every outcome threshold, the absolute difference between their conditional CDFs cannot exceed k<sub>d,c</sub> times the distance between those two values.", "say": "Take any two values in the support of the running variable. At every outcome threshold, the absolute difference between their conditional C-D-Fs cannot exceed k d c times the distance between those two values."}, {"show": "Here, k<sub>d,c</sub> is a sensitivity parameter that controls the strength of this assumption.", "say": "Here, k d c is a sensitivity parameter that controls the strength of this assumption."}]}, {"id": "S10", "num": "10", "title": "Interpreting the Smoothness Assumption", "paras": [{"show": "There are a few ways to interpret this assumption.", "say": "There are a few ways to interpret this assumption."}, {"show": "First, smoothness is imposed on the entire conditional distribution, rather than only on the conditional mean.", "say": "First, smoothness is imposed on the entire conditional distribution, rather than only on the conditional mean."}, {"show": "More precisely, when two values of the running variable are close, the sup distance between the two conditional distributions should also be small.", "say": "More precisely, when two values of the running variable are close, the soup distance between the two conditional distributions should also be small."}, {"show": "Second, k<sub>d,c</sub> determines the degree of smoothness.", "say": "Second, k d c determines the degree of smoothness."}, {"show": "A smaller value of k<sub>d,c</sub> requires greater similarity across the running variable, while a larger value allows greater differences.", "say": "A smaller value of k d c requires greater similarity across the running variable, while a larger value allows greater differences."}, {"show": "At the extreme, if k<sub>d,c</sub> = 0, the potential-outcome distribution does not vary with the running variable. In other words, Y<sub>d</sub> is independent of <i>R</i>.", "say": "At the extreme, if k d c equals zero, the potential-outcome distribution does not vary with the running variable. In other words, Y d is independent of R."}, {"show": "Therefore, if both k<sub>0,c</sub> and k<sub>1,c</sub> are zero, treatment effects for all subpopulations and for the overall population are the same as those at the cutoff.", "say": "Therefore, if both k zero c and k one c are zero, treatment effects for all subpopulations and for the overall population are the same as those at the cutoff."}]}, {"id": "S11", "num": "11", "title": "Bounds on Counterfactual Distributions", "paras": [{"show": "This is our main identification result.", "say": "This is our main identification result."}, {"show": "First, let r<sub>1</sub>* and r<sub>0</sub>* denote the boundary points closest to the cutoff in the treated and control regions, respectively. In the standard sharp RD setup, both are equal to the cutoff <i>c</i>.", "say": "First, let r one star and r zero star denote the boundary points closest to the cutoff in the treated and control regions, respectively. In the standard sharp R-D setup, both are equal to the cutoff c."}, {"show": "The key feature of the result is that the counterfactual distribution at a target value <i>r</i> can be bounded using only the distribution identified at the boundary point.", "say": "The key feature of the result is that the counterfactual distribution at a target value r can be bounded using only the distribution identified at the boundary point."}, {"show": "More specifically, starting from the boundary distribution, we construct the lower and upper bounds by subtracting and adding k<sub>d,c</sub> times the distance between the boundary point and the target point.", "say": "More specifically, starting from the boundary distribution, we construct the lower and upper bounds by subtracting and adding k d c times the distance between the boundary point and the target point."}, {"show": "Importantly, these pointwise bounds have a sharp interior.", "say": "Importantly, these pointwise bounds have a sharp interior."}]}, {"id": "S12", "num": "12", "title": "From Smoothness to Intersection Bounds", "paras": [{"show": "Let me explain why the bounds take this form.", "say": "Let me explain why the bounds take this form."}, {"show": "Suppose we want to identify the distribution of Y<sub>1</sub> at some point r<sub>0</sub> in the control region.", "say": "Suppose we want to identify the distribution of Y one at some point r zero in the control region."}, {"show": "Now take any point r̃ in the treated region. At this point, the distribution of Y<sub>1</sub> is identified from the data.", "say": "Now take any point r tilde in the treated region. At this point, the distribution of Y one is identified from the data."}, {"show": "Using the smoothness assumption, this observed distribution provides lower and upper bounds for the counterfactual distribution at r<sub>0</sub>.", "say": "Using the smoothness assumption, this observed distribution provides lower and upper bounds for the counterfactual distribution at r zero."}, {"show": "In the slide, the red term is the target we want to identify, and the blue terms are the bounds obtained from a given r̃.", "say": "In the slide, the red term is the target we want to identify, and the blue terms are the bounds obtained from a given r tilde."}, {"show": "Since each point in the treated region provides valid bounds, we take the supremum of the lower bounds and the infimum of the upper bounds to obtain the tightest bounds.", "say": "Since each point in the treated region provides valid bounds, we take the supremum of the lower bounds and the infimum of the upper bounds to obtain the tightest bounds."}]}, {"id": "S13", "num": "13", "title": "Extrapolation from the Boundary", "paras": [{"show": "In a sharp RD, these intersection bounds simplify further. This figure shows the intuition.", "say": "In a sharp R-D, these intersection bounds simplify further. This figure shows the intuition."}, {"show": "The control region lies to the left of the cutoff, while treated region lies to the right.", "say": "The control region lies to the left of the cutoff, while treated region lies to the right."}, {"show": "Here, r<sub>0</sub> is the target point where we want to extrapolate, and r<sub>1</sub>* is the boundary point of the treated region.", "say": "Here, r zero is the target point where we want to extrapolate, and r one star is the boundary point of the treated region."}, {"show": "The gray lines show the bounds obtained from different points r̃ in the treated region.", "say": "The gray lines show the bounds obtained from different points r tilde in the treated region."}, {"show": "In principle, we would search over all of these points and take the highest lower bound and the lowest upper bound. But in a sharp RD, both can be obtained using the boundary point r<sub>1</sub>* alone.", "say": "In principle, we would search over all of these points and take the highest lower bound and the lowest upper bound. But in a sharp R-D, both can be obtained using the boundary point r one star alone."}, {"show": "To see why, consider the lower bound. Moving from the boundary to an interior point may increase the CDF value. But the smoothness assumption limits this increase to k<sub>1,c</sub> times the distance between the boundary and the interior point. At the same time, moving to the interior point increases the distance from the target by exactly the same amount.", "say": "To see why, consider the lower bound. Moving from the boundary to an interior point may increase the C-D-F value. But the smoothness assumption limits this increase to k one c times the distance between the boundary and the interior point. At the same time, moving to the interior point increases the distance from the target by exactly the same amount."}, {"show": "Therefore, the additional gain in the CDF value cannot exceed the additional distance penalty. So an interior point cannot improve the lower bound. The same argument applies to the upper bound.", "say": "Therefore, the additional gain in the C-D-F value cannot exceed the additional distance penalty. So an interior point cannot improve the lower bound. The same argument applies to the upper bound."}, {"show": "As a result, the bounds depend only on the boundary distribution and the distance from the boundary to the target. This is what makes our bounds simple and tractable.", "say": "As a result, the bounds depend only on the boundary distribution and the distance from the boundary to the target. This is what makes our bounds simple and tractable."}]}, {"id": "S14", "num": "14", "title": "From Distribution Bounds to Causal Parameters", "paras": [{"show": "These distribution bounds allow us to study some causal parameters.", "say": "These distribution bounds allow us to study some causal parameters."}, {"show": "For a subpopulation with the running variable equal to r, we can invert the distribution bounds to obtain bounds on the conditional QTE. We can also obtain bounds on the conditional ATE.", "say": "For a subpopulation with the running variable equal to r, we can invert the distribution bounds to obtain bounds on the conditional Q-T-E. We can also obtain bounds on the conditional A-T-E."}, {"show": "For the overall population, we can similarly obtain bounds on the QTE and the ATE.", "say": "For the overall population, we can similarly obtain bounds on the Q-T-E and the A-T-E."}]}, {"id": "S15", "num": "15", "title": "Choosing k<sub>0,c</sub> and k<sub>1,c</sub>", "paras": [{"show": "An important issue is how to choose the smoothness parameters.", "say": "An important issue is how to choose the smoothness parameters."}, {"show": "Because the smoothness assumption is global, including the counterfactual region, k<sub>d,c</sub> cannot be determined from the observed data alone.", "say": "Because the smoothness assumption is global, including the counterfactual region, k d c cannot be determined from the observed data alone."}, {"show": "However, variation in the conditional CDF over the observed region can inform its choice.", "say": "However, variation in the conditional C-D-F over the observed region can inform its choice."}, {"show": "As a simple benchmark, we use the steepest change in the conditional CDF over this region.", "say": "As a simple benchmark, we use the steepest change in the conditional C-D-F over this region."}, {"show": "Researchers can then vary k<sub>0,c</sub> and k<sub>1,c</sub> around this benchmark to assess the sensitivity of the bounds.", "say": "Researchers can then vary k zero c and k one c around this benchmark to assess the sensitivity of the bounds."}]}, {"id": "S16", "num": "16", "title": "Stochastically Monotone Running Variable", "paras": [{"show": "So far, we have considered the baseline smoothness assumption.", "say": "So far, we have considered the baseline smoothness assumption."}, {"show": "We also consider an additional assumption, which we call the SMRV assumption.", "say": "We also consider an additional assumption, which we call the S-M-R-V assumption."}, {"show": "Under this assumption, higher values of the running variable are associated with higher potential outcomes. More precisely, the potential-outcome distributions are ordered by first-order stochastic dominance under either treatment status.", "say": "Under this assumption, higher values of the running variable are associated with higher potential outcomes. More precisely, the potential-outcome distributions are ordered by first-order stochastic dominance under either treatment status."}, {"show": "In the school example, this means that students with higher admission scores tend to have higher later exam scores, whether or not they are assigned to the better school.", "say": "In the school example, this means that students with higher admission scores tend to have higher later exam scores, whether or not they are assigned to the better school."}, {"show": "This assumption rules out some counterfactual distributions and further tightens the bounds.", "say": "This assumption rules out some counterfactual distributions and further tightens the bounds."}]}, {"id": "S17", "num": "17", "title": "Estimation", "paras": [{"show": "Let me briefly discuss estimation.", "say": "Let me briefly discuss estimation."}]}, {"id": "S18", "num": "18", "title": "Estimation of Bounds", "paras": [{"show": "We use distribution regression to estimate the conditional distributions of the potential outcomes over the observed regions, including at the boundary.", "say": "We use distribution regression to estimate the conditional distributions of the potential outcomes over the observed regions, including at the boundary."}, {"show": "Alternatively, nonparametric methods could be used.", "say": "Alternatively, nonparametric methods could be used."}]}, {"id": "S19", "num": "19", "title": "Empirical Application", "paras": [{"show": "Let me now turn to the empirical application.", "say": "Let me now turn to the empirical application."}]}, {"id": "S20", "num": "20", "title": "Empirical Setting", "paras": [{"show": "We revisit the Romanian high-school application of Pop-Eleches and Urquiola.", "say": "We revisit the Romanian high-school application of Pop Eh-leh-kess and Oor-kee-oh-la."}, {"show": "Students are assigned to high schools based on admission scores and ranked school choices, which generate school-specific cutoffs.", "say": "Students are assigned to high schools based on admission scores and ranked school choices, which generate school-specific cutoffs."}, {"show": "The treatment is assignment to a better school, and the main outcome is the Baccalaureate exam score, a national exam used for university admission.", "say": "The treatment is assignment to a better school, and the main outcome is the Baccalaureate exam score, a national exam used for university admission."}, {"show": "We use our framework to examine treatment effects away from the cutoff and for the overall population.", "say": "We use our framework to examine treatment effects away from the cutoff and for the overall population."}, {"show": "For the results I’ll show, we use the benchmark values k<sub>0,c</sub> = 0.26 and k<sub>1,c</sub> = 0.45.", "say": "For the results I'll show, we use the benchmark values k zero c equals 0.26 and k one c equals 0.45."}]}, {"id": "S21", "num": "21", "title": "CQTE, τ=0.2", "paras": [{"show": "Let me first show the CQTE at the 20th percentile.", "say": "Let me first show the C-Q-T-E at the 20th percentile."}, {"show": "The horizontal axis is the running variable, with the cutoff normalized to zero. The reference line shows the RD estimate at the cutoff.", "say": "The horizontal axis is the running variable, with the cutoff normalized to zero. The reference line shows the R-D estimate at the cutoff."}, {"show": "Our framework gives bounds on the CQTE at other values of the running variable. The dashed lines show the baseline bounds, while the solid lines show the bounds with the additional SMRV assumption.", "say": "Our framework gives bounds on the C-Q-T-E at other values of the running variable. The dashed lines show the baseline bounds, while the solid lines show the bounds with the additional S-M-R-V assumption."}, {"show": "There are two things to notice.", "say": "There are two things to notice."}, {"show": "First, SMRV substantially tightens the bounds, particularly the upper bound.", "say": "First, S-M-R-V substantially tightens the bounds, particularly the upper bound."}, {"show": "Second, for some subpopulations to the right of the cutoff, the lower bound lies above the RD estimate at the cutoff.", "say": "Second, for some subpopulations to the right of the cutoff, the lower bound lies above the R-D estimate at the cutoff."}, {"show": "Under our assumptions, these estimated bounds suggest that assignment to a better school raises the 20th percentile of exam scores more for these groups than for students at the cutoff.", "say": "Under our assumptions, these estimated bounds suggest that assignment to a better school raises the 20th percentile of exam scores more for these groups than for students at the cutoff."}]}, {"id": "S22", "num": "22", "title": "CQTE, τ=0.8", "paras": [{"show": "Now consider the 80th percentile.", "say": "Now consider the 80th percentile."}, {"show": "Here, the pattern is different. The bounds generally include the RD estimate at the cutoff.", "say": "Here, the pattern is different. The bounds generally include the R-D estimate at the cutoff."}, {"show": "So, at this quantile, we do not see the same pattern as before.", "say": "So, at this quantile, we do not see the same pattern as before."}]}, {"id": "S23", "num": "23", "title": "QTE for the Overall Population", "paras": [{"show": "So far, we have looked at subpopulations indexed by the running variable. Now let me turn to the QTE for the overall population.", "say": "So far, we have looked at subpopulations indexed by the running variable. Now let me turn to the Q-T-E for the overall population."}, {"show": "The first column reports the RD estimate at the cutoff, and the next two columns show the QTE bounds under the baseline smoothness assumption and the additional SMRV assumption.", "say": "The first column reports the R-D estimate at the cutoff, and the next two columns show the Q-T-E bounds under the baseline smoothness assumption and the additional S-M-R-V assumption."}, {"show": "For quantiles from 0.4 to 0.7, the lower bound lies above the RD estimate at the cutoff.", "say": "For quantiles from 0.4 to 0.7, the lower bound lies above the R-D estimate at the cutoff."}, {"show": "This suggests that, at these quantiles, the QTE for the overall population may differ from the cutoff effect.", "say": "This suggests that, at these quantiles, the Q-T-E for the overall population may differ from the cutoff effect."}]}, {"id": "S24", "num": "24", "title": "CATE and ATE", "paras": [{"show": "Let me compare these results with the mean effects.", "say": "Let me compare these results with the mean effects."}, {"show": "When the running variable equals zero, the CATE is the cutoff effect.", "say": "When the running variable equals zero, the C-eh-T-E is the cutoff effect."}, {"show": "For the other values of the running variable shown here, the CATE bounds include the cutoff effect, and the ATE bounds do as well.", "say": "For the other values of the running variable shown here, the C-eh-T-E bounds include the cutoff effect, and the A-T-E bounds do as well."}, {"show": "So, for the mean effects, we do not see the same pattern as for some of the quantile effects.", "say": "So, for the mean effects, we do not see the same pattern as for some of the quantile effects."}]}, {"id": "S25", "num": "25", "title": "Breakdown Frontier", "paras": [{"show": "So far, I have shown results using our benchmark smoothness parameters. Now let me show how sensitive the conclusion about the ATE is to those parameters.", "say": "So far, I have shown results using our benchmark smoothness parameters. Now let me show how sensitive the conclusion about the A-T-E is to those parameters."}, {"show": "The substantive conclusion here is that the ATE is nonnegative.", "say": "The substantive conclusion here is that the A-T-E is nonnegative."}, {"show": "The horizontal and vertical axes are the two smoothness parameters. Larger values correspond to weaker smoothness restrictions.", "say": "The horizontal and vertical axes are the two smoothness parameters. Larger values correspond to weaker smoothness restrictions."}, {"show": "The black line is the breakdown frontier: below the frontier, the lower bound on the ATE remains nonnegative, while beyond the frontier this conclusion can no longer be guaranteed.", "say": "The black line is the breakdown frontier: below the frontier, the lower bound on the A-T-E remains nonnegative, while beyond the frontier this conclusion can no longer be guaranteed."}, {"show": "The frontier also shows the tradeoff between the two smoothness parameters. We can allow weaker smoothness for one potential outcome only if we impose stronger smoothness on the other.", "say": "The frontier also shows the tradeoff between the two smoothness parameters. We can allow weaker smoothness for one potential outcome only if we impose stronger smoothness on the other."}]}, {"id": "S26", "num": "26", "title": "Conclusions", "paras": []}, {"id": "S27", "num": "27", "title": "Conclusions", "paras": [{"show": "To conclude, we develop a framework for extrapolating treatment effects beyond the cutoff in sharp RD designs under a smoothness assumption.", "say": "To conclude, we develop a framework for extrapolating treatment effects beyond the cutoff in sharp R-D designs under a smoothness assumption."}, {"show": "We derive sharp and tractable bounds on counterfactual distributions, which allow us to study both distributional and mean treatment effects.", "say": "We derive sharp and tractable bounds on counterfactual distributions, which allow us to study both distributional and mean treatment effects."}, {"show": "In the application, treatment effects away from the cutoff and for the overall population may differ from the cutoff effect, particularly for distributional effects.", "say": "In the application, treatment effects away from the cutoff and for the overall population may differ from the cutoff effect, particularly for distributional effects."}, {"show": "Thank you very much.", "say": "Thank you very much."}]}, {"id": "S28", "num": "28", "title": "Thank You", "paras": []}, {"id": "QA", "num": "Q&A", "title": "Appendix — CQTE, τ=0.5", "paras": [{"show": "At the median, we see a pattern similar to the lower quantile.", "say": "At the median, we see a pattern similar to the lower quantile."}, {"show": "For some subpopulations to the right of the cutoff, the lower bound exceeds the CQTE estimate at the cutoff.", "say": "For some subpopulations to the right of the cutoff, the lower bound exceeds the C-Q-T-E estimate at the cutoff."}, {"show": "So the evidence of heterogeneity is not limited to the 20th percentile.", "say": "So the evidence of heterogeneity is not limited to the 20th percentile."}]}];

const au = document.getElementById('au');
const playBtn = document.getElementById('play');
let idx = 0, wantPlay = false, lastP = null;
const speeds = [0.85, 1, 1.1, 1.2, 1.3]; let si = 1;
au.preservesPitch = true;

// point an <audio> at the best source for this slide: the in-memory copy when it is ready, otherwise the file
function setSrc(el, id) {
  const want = new URL(srcOf(id), location.href).href;
  if (el.src !== want) { el.src = want; return true; }
  return false;
}
function load(i, t) {
  idx = i;
  const id = playable[i].id;
  const go = () => { au.currentTime = t || 0; au.playbackRate = speeds[si]; if (wantPlay) au.play().catch(()=>{}); };
  if (setSrc(au, id)) {
    // start playback inside the tap itself (iPhone requires this), then seek once the file is ready
    if (wantPlay) au.play().catch(()=>{});
    au.addEventListener('loadedmetadata', go, { once: true });
  } else if (au.readyState >= 1) go(); else au.addEventListener('loadedmetadata', go, { once: true });
  document.querySelectorAll('.chip').forEach((c, k) => { c.classList.toggle('on', k === i); c.classList.toggle('done', k < i); });
  const ch = document.getElementById('chip-' + id); ch && ch.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
  tick();
}
function jump(i, t) { if (i < 0) return; wantPlay = true; setBtn(); load(i, t); }
function setBtn() { playBtn.textContent = wantPlay ? '❚❚' : '▶'; playBtn.setAttribute('aria-label', wantPlay ? '일시정지' : '재생'); }
playBtn.onclick = () => {
  wantPlay = !wantPlay; setBtn();
  if (wantPlay) load(idx, au.currentTime || 0); else au.pause();
};
document.getElementById('prev').onclick = () => jump(au.currentTime > 2 ? idx : Math.max(0, idx - 1), 0);
document.getElementById('next').onclick = () => idx < playable.length - 1 && jump(idx + 1, 0);
document.getElementById('speed').onclick = e => { si = (si + 1) % speeds.length; au.playbackRate = speeds[si]; e.target.textContent = speeds[si].toFixed(speeds[si] === 1 ? 1 : 2).replace(/0$/, '') + '×'; };
au.addEventListener('ended', () => { if (idx < playable.length - 1) load(idx + 1, 0); else { wantPlay = false; setBtn(); } });

function tick() {
  const s = playable[idx], t = tmap[s.id], ct = au.currentTime || 0;
  let pi = 0; t.marks.forEach((m, k) => { if (ct >= m - 0.05) pi = k; });
  const el = document.querySelector(`p[data-s="${s.id}"][data-i="${pi}"]`);
  if (el !== lastP) {
    lastP && lastP.classList.remove('now'); el && el.classList.add('now'); lastP = el;
    if (el && wantPlay) {
      const r = el.getBoundingClientRect(), top = document.querySelector('header').getBoundingClientRect().bottom;
      if (r.top < top + 10 || r.bottom > innerHeight - 140) window.scrollBy({ top: r.top - top - 40, behavior: 'smooth' });
    }
  }
  const g = offs[idx] + ct;
  document.getElementById('fill').style.width = (100 * g / TOTAL) + '%';
  document.getElementById('tm').textContent = fmt(g) + ' / ' + fmt(TOTAL);
}
au.addEventListener('timeupdate', tick);
document.getElementById('prog').onclick = e => {

};

function initials(html) {

    const m = tok.match(/^([^A-Za-z0-9]*)([A-Za-z0-9])([A-Za-z0-9'’\-]*)(.*)$/);
    if (!m || !m[3]) return tok;
    const w = Math.min(4, 0.42 * m[3].length).toFixed(2);
    return `<span class="w">${m[1]}${m[2]}<span class="rest">${m[3]}</span><span class="gap" style="width:${w}em"></span>${m[4]}</span>`;
  }).join(' ');
}

    b.className = 'chip mchip' + (k === mi ? ' on' : '');
    const v = store.get(s.id);
    b.innerHTML = `<span>${s.num}</span><span class="dots">${[1,2,3].map(x => `<i class="${x <= v ? 'f' : ''}"></i>`).join('')}</span>`;
    b.setAttribute('aria-label', `Slide ${s.num}, ${v}단계 완료`);
    b.onclick = () => { mi = k; lv = Math.min(store.get(MEM[k].id), 2); renderMem(); };
    ms.appendChild(b);
  });
  const on = ms.children[mi]; on && on.scrollIntoView({ inline: 'center', block: 'nearest' });
}

function renderMem() {
  stopPara();
  const s = MEM[mi], t = tmap[s.id], done = store.get(s.id);
  const c = document.getElementById('mcard');
  let h = `<div class="ch"><span class="sn">${s.num === 'Q&A' ? 'Q&amp;A' : 'SLIDE ' + s.num}</span><span class="st">${s.title}</span><span class="sd">${fmt(t.dur)}</span></div>`;
  h += `<div class="lv">${LV.map((L, k) => `<button class="lvb${k === lv ? ' on' : ''}${k < done ? ' ok' : ''}" data-l="${k}">${L.k}<small>${k < done ? '✓ 완료' : L.d}</small></button>`).join('')}</div>`;
  s.paras.forEach((p, i) => {
    let body;
    if (lv === 0) body = p.show;
    else if (lv === 1) body = initials(p.show);
    else if (lv === 2) body = firstWords(p.show, 3);
    else body = `<span class="blank">문단 ${i + 1} · ${plain(p.show).split(/\s+/).length}단어</span>`;
    h += `<div class="mp"><button class="pb" data-i="${i}" aria-label="문단 ${i + 1} 듣기">▶</button><div class="mt" data-i="${i}" tabindex="0">${body}</div></div>`;
  });
  h += `<div class="acts"><button class="btn" id="m-all">${lv === 0 ? '슬라이드 전체 듣기' : '전부 보기'}</button></div>`;
  h += `<div class="hint">${lv === 0 ? '한두 번 따라 읽었으면' : '끝까지 말해본 뒤'} 평가하세요.</div>`;
  h += `<div class="rate"><button class="btn" data-r="0">다시</button><button class="btn" data-r="1">거의</button><button class="btn pri" data-r="2">완벽 → ${lv < 2 ? '다음 단계' : '다음 슬라이드'}</button></div>`;
  h += `<div class="nav2"><button class="btn" id="m-prev">← 이전 슬라이드</button><button class="btn" id="m-next">다음 슬라이드 →</button></div>`;
  c.innerHTML = h;

  c.querySelectorAll('.lvb').forEach(b => b.onclick = () => { lv = +b.dataset.l; renderMem(); });
  c.querySelectorAll('.mt').forEach(el => el.onclick = e => {
    const i = +el.dataset.i, p = s.paras[i];
    if (lv === 1) { const w = e.target.closest('.w'); if (w) { w.classList.toggle('show'); return; } }
    if (lv === 0) return;
    if (el.classList.toggle('open')) el.innerHTML = p.show;
    else el.innerHTML = lv === 1 ? initials(p.show) : lv === 2 ? firstWords(p.show, 3) : `<span class="blank">문단 ${i + 1} · ${plain(p.show).split(/\s+/).length}단어</span>`;
  });
  c.querySelectorAll('.pb').forEach(b => b.onclick = () => playPara(s, +b.dataset.i, false));
  document.getElementById('m-all').onclick = () => {
    if (lv === 0) playPara(s, 0, true);
    else c.querySelectorAll('.mt').forEach((el, i) => { el.classList.add('open'); el.innerHTML = s.paras[i].show; });
  };
  c.querySelectorAll('[data-r]').forEach(b => b.onclick = () => {
    const r = +b.dataset.r;
    if (r === 2) {
      if (lv + 1 > store.get(s.id)) store.set(s.id, lv + 1);
      if (lv < 2) lv++;
      else { mi = nextWeak(mi); lv = Math.min(store.get(MEM[mi].id), 2); }
    } else if (r === 0 && lv > 0) lv--;
    renderStrip(); renderMem();
    document.getElementById('mcard').scrollIntoView({ block: 'start', behavior: 'smooth' });
  });
  document.getElementById('m-prev').onclick = () => { if (mi > 0) { mi--; lv = Math.min(store.get(MEM[mi].id), 2); renderStrip(); renderMem(); } };
  document.getElementById('m-next').onclick = () => { if (mi < MEM.length - 1) { mi++; lv = Math.min(store.get(MEM[mi].id), 2); renderStrip(); renderMem(); } };
  renderStrip();
}
function nextWeak(from) {
  for (let k = 1; k <= MEM.length; k++) { const j = (from + k) % MEM.length; if (store.get(MEM[j].id) < 3) return j; }
  return (from + 1) % MEM.length;
}

// paragraph playback on a second audio element
const au2 = document.getElementById('au2');
let stopAt = null, playingBtn = null;
function stopPara() { au2.pause(); stopAt = null; playingBtn && playingBtn.classList.remove('on'); playingBtn = null; }
function playPara(s, i, toEnd) {
  const btn = document.querySelector(`.pb[data-i="${i}"]`);
  if (playingBtn === btn && !au2.paused) { stopPara(); return; }
  stopPara(); wantPlay = false; setBtn(); au.pause();
  const t = tmap[s.id];
  stopAt = toEnd ? t.dur : (t.marks[i + 1] !== undefined ? t.marks[i + 1] - 0.3 : t.dur);
  playingBtn = btn; btn && btn.classList.add('on');
  const go = () => { au2.currentTime = t.marks[i]; au2.play().catch(() => {}); };
  if (setSrc(au2, s.id)) {
    au2.muted = true; au2.play().catch(() => {});
    au2.addEventListener('loadedmetadata', () => { au2.currentTime = t.marks[i]; au2.addEventListener('seeked', () => { au2.muted = false; }, { once: true }); }, { once: true });
  } else go();
}
au2.addEventListener('timeupdate', () => { if (stopAt !== null && au2.currentTime >= stopAt) stopPara(); });
au2.addEventListener('ended', stopPara);

/* ================= first-sentence drill ================= */
const firstSent = h => { const m = h.match(/^.*?[.!?](?=\s|$)/); return m ? m[0] : h; };
const lastSent = h => { const parts = h.split(/(?<=[.!?])\s+/); return parts[parts.length - 1]; };
let fi = 0, shown = false, known = 0, seen = 0, order = MEM.map((_, k) => k);
function renderFirst() {
  const k = order[fi % order.length], s = MEM[k], prev = MEM[k - 1];
  const c = document.getElementById('fcard');
  let h = `<div class="ch"><span class="sn">${s.num === 'Q&A' ? 'Q&amp;A' : 'SLIDE ' + s.num}</span><span class="st">${s.title}</span><span class="sd score">${known}/${seen} 맞힘</span></div>`;
  if (prev) h += `<div class="ctx"><b>앞 슬라이드 (${prev.num}) 마지막 문장</b>${lastSent(prev.paras[prev.paras.length - 1].show)}</div>`;
  else h += `<div class="ctx"><b>발표 시작</b>첫 인사부터 말해보세요.</div>`;
  if (shown) {
    h += `<div class="ans">${firstSent(s.paras[0].show)}</div>`;
    h += `<div class="rate" style="grid-template-columns:1fr 1fr"><button class="btn" data-f="0">막혔음</button><button class="btn pri" data-f="1">바로 나왔음</button></div>`;
  } else {
    h += `<div class="acts"><button class="btn pri" id="f-show">정답 보기</button><button class="btn" id="f-play">▶ 듣기</button></div>`;
  }
  h += `<div class="nav2"><button class="btn" id="f-shuf">${order.some((v, j) => v !== j) ? '순서대로' : '섞기'}</button><button class="btn" id="f-skip">건너뛰기 →</button></div>`;
  c.innerHTML = h;
  const nextQ = () => { fi = (fi + 1) % order.length; shown = false; renderFirst(); };
  const sh = document.getElementById('f-show'); sh && (sh.onclick = () => { shown = true; renderFirst(); });
  const pl = document.getElementById('f-play'); pl && (pl.onclick = () => { shown = true; renderFirst(); playPara(s, 0, false); });
  c.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { seen++; known += +b.dataset.f; stopPara(); nextQ(); });
  document.getElementById('f-skip').onclick = () => { stopPara(); nextQ(); };
  document.getElementById('f-shuf').onclick = () => {
    if (order.some((v, j) => v !== j)) order = MEM.map((_, j) => j);
    else { order = MEM.map((_, j) => j); for (let j = order.length - 1; j > 0; j--) { const r = Math.floor(Math.random() * (j + 1)); [order[j], order[r]] = [order[r], order[j]]; } }
    fi = 0; shown = false; known = 0; seen = 0; renderFirst();
  };
}

/* ================= tabs ================= */
function view(v) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.v === v));
  document.getElementById('script').hidden = v !== 'listen';
  document.getElementById('strip').hidden = v !== 'listen';
  document.getElementById('lbar').hidden = v !== 'listen';
  document.getElementById('mem').hidden = v !== 'mem';
  document.getElementById('mstrip').hidden = v !== 'mem';
  document.getElementById('first').hidden = v !== 'first';
  if (v !== 'listen') { wantPlay = false; setBtn(); au.pause(); }
  else stopPara();
  if (v === 'mem') renderMem();
  if (v === 'first') renderFirst();
  window.scrollTo(0, 0);
}
document.querySelectorAll('.tab').forEach(t => t.onclick = () => view(t.dataset.v));
if (location.hash === '#mem' || location.hash === '#first') view(location.hash.slice(1));

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
