<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weekly Tracker</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f5f1;
    --card: #ffffff;
    --ink: #1f2328;
    --muted: #6b7280;
    --line: #e5e3dc;
    --accent: #b45309;
    --accent-soft: #fef3e2;
    --green: #15803d;
    --blue: #1d4ed8;
    --blue-soft: #eff6ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", sans-serif;
    font-size: 14px; line-height: 1.5;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 20px 16px 60px; }

  .top { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; margin-bottom: 14px; }
  .meta { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .meta input {
    border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; font-size: 13.5px;
    background: #fbfaf7; color: var(--ink); outline: none;
  }
  .meta input:focus { border-color: var(--accent); }
  #paperTitle { flex: 1; min-width: 240px; }
  #weekLabel { width: 130px; }
  .progress-row { display: flex; align-items: center; gap: 12px; }
  .bar { flex: 1; height: 10px; background: #eeece5; border-radius: 99px; overflow: hidden; }
  .bar > div { height: 100%; background: linear-gradient(90deg, #d97706, #b45309); width: 0%; transition: width .3s; border-radius: 99px; }
  .pct { font-weight: 700; font-size: 13px; min-width: 88px; text-align: right; }
  .top-actions { margin-top: 12px; display: flex; gap: 8px; }
  button.btn {
    border: 1px solid var(--line); background: #fbfaf7; color: var(--ink);
    border-radius: 8px; padding: 6px 12px; font-size: 12.5px; cursor: pointer;
  }
  button.btn:hover { background: #f1efe8; }
  button.btn:disabled { opacity: .45; cursor: default; }
  button.btn.danger { color: #b91c1c; }
  label.btn { border: 1px solid var(--line); background: #fbfaf7; border-radius: 8px; padding: 6px 12px; font-size: 12.5px; cursor: pointer; display: inline-block; }
  label.btn:hover { background: #f1efe8; }

  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .tab {
    border: 1px solid var(--line); background: var(--card); border-radius: 10px;
    padding: 8px 10px; cursor: pointer; text-align: center; min-width: 64px; flex: 1;
  }
  .tab .d { font-weight: 700; font-size: 13.5px; }
  .tab .badge { font-size: 10.5px; margin-top: 3px; color: var(--muted); }
  .tab.done .badge { color: var(--green); font-weight: 700; }
  .tab.active { border-color: var(--accent); background: var(--accent-soft); }
  .tab.today { box-shadow: 0 0 0 2px rgba(180,83,9,.25); }

  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
  .day-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .day-head h2 { margin: 0; font-size: 17px; }
  .goal { color: var(--muted); font-size: 13px; margin-bottom: 16px; padding-left: 10px; border-left: 3px solid var(--accent); }

  .sec { margin-bottom: 18px; }
  .sec h3 {
    margin: 0 0 8px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase;
    color: var(--muted); display: flex; align-items: center; gap: 8px;
  }
  .sec h3 .cnt { font-weight: 400; }
  .item { display: flex; align-items: flex-start; gap: 9px; padding: 7px 8px; border-radius: 8px; cursor: pointer; }
  .item:hover { background: #faf9f5; }
  .item input[type=checkbox] { margin-top: 3px; accent-color: var(--accent); width: 15px; height: 15px; cursor: pointer; flex-shrink: 0; }
  .item .time { color: var(--accent); font-weight: 600; font-size: 12.5px; min-width: 78px; flex-shrink: 0; }
  .item .txt { flex: 1; }
  .item.checked .txt, .item.checked .time { color: #a8a29e; text-decoration: line-through; }
  .sec.output { background: var(--blue-soft); border-radius: 10px; padding: 12px 12px 8px; }
  .sec.output h3 { color: var(--blue); }
  .sec.output .item input[type=checkbox] { accent-color: var(--blue); }
  .sec.evening { background: #faf9f5; border-radius: 10px; padding: 12px 12px 8px; }

  textarea.memo {
    width: 100%; min-height: 110px; border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; font-size: 13px; font-family: inherit; background: #fffdf8;
    color: var(--ink); resize: vertical; outline: none;
  }
  textarea.memo:focus { border-color: var(--accent); }
  .hint { font-size: 12px; color: var(--muted); margin: 6px 0 0; }

  .rule { background: #faf9f5; border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; font-size: 13px; }
  .rule b { display: block; margin-bottom: 3px; }
  table.hist { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.hist th, table.hist td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); }
  table.hist th { color: var(--muted); font-weight: 600; font-size: 12px; }
  .empty { color: var(--muted); font-size: 13px; padding: 8px; }

  .seg { display: flex; gap: 6px; margin-bottom: 14px; }
  .segbtn.on { background: var(--accent-soft); border-color: var(--accent); font-weight: 700; }
  .vrow { display: flex; gap: 8px; flex-wrap: wrap; }
  .vrow input { flex: 1; min-width: 140px; border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; font-size: 13.5px; background: #fbfaf7; outline: none; color: var(--ink); }
  .vrow input:focus { border-color: var(--accent); }
  input.vlong { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; font-size: 13px; background: #fbfaf7; outline: none; color: var(--ink); margin-top: 6px; }
  input.vlong:focus { border-color: var(--accent); }
  .ventry { padding: 7px 8px; border-bottom: 1px solid var(--line); }
  .vtop { display: flex; gap: 10px; align-items: baseline; }
  .vtop .vm { color: var(--muted); flex: 1; }
  .vex { font-size: 12.5px; color: var(--muted); font-style: italic; margin-top: 3px; padding-left: 2px; }
  .vwrong { color: #b91c1c; font-size: 12px; font-weight: 700; }
  .vdaytag { font-size: 11px; color: var(--accent); font-weight: 700; flex-shrink: 0; }
  input.vnum { width: 62px; flex: 0 0 62px; border: 1px solid var(--line); border-radius: 6px; padding: 5px 6px; font-size: 13px; background: #fbfaf7; outline: none; color: var(--ink); }
  input.vnum:focus { border-color: var(--accent); }
  select.vsortsel { border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; font-size: 12.5px; background: #fbfaf7; color: var(--ink); outline: none; flex: 0 0 auto; }
  .vsm, .vdel { padding: 2px 8px; font-size: 11px; flex-shrink: 0; }
  .vtop input[type=checkbox] { accent-color: var(--accent); width: 14px; height: 14px; cursor: pointer; align-self: center; flex-shrink: 0; }
  .vitem { display: flex; gap: 10px; align-items: baseline; padding: 5px 8px; border-bottom: 1px solid var(--line); }
  .vitem .vm { color: var(--muted); flex: 1; }
  .qword { font-size: 26px; font-weight: 700; margin: 12px 0; }
  .qopt { display: block; width: 100%; text-align: left; margin-top: 6px; padding: 9px 12px; font-size: 13.5px; background: #fff; }
  .qopt.correct { background: var(--green-soft, #ecfdf3); border-color: var(--green); font-weight: 700; }
  .qopt.wrongpick { background: #fef2f2; border-color: #b91c1c; }
  .qmean { font-size: 15px; margin-bottom: 6px; }
  .qex { font-size: 13px; color: var(--muted); font-style: italic; margin-bottom: 12px; }
  .fileline { display: flex; gap: 8px; align-items: center; margin-top: 6px; flex-wrap: wrap; }
  .fname { font-size: 12.5px; color: var(--muted); }
  .iedit { border: none; background: none; color: #d6d1c6; cursor: pointer; font-size: 12px; padding: 0 2px; flex-shrink: 0; }
  .item:hover .iedit { color: var(--accent); }
  .iedit-input { flex: 1; border: 1px solid var(--accent); border-radius: 6px; padding: 4px 8px; font-size: 13.5px; font-family: inherit; outline: none; background: #fffdf8; color: var(--ink); }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="meta">
      <input id="paperTitle" placeholder="이번 주 논문 제목">
      <input id="weekLabel" placeholder="예: Week 1">
    </div>
    <div class="progress-row">
      <div class="bar"><div id="weekBar"></div></div>
      <div class="pct" id="weekPct">0% (0/0)</div>
    </div>
    <div class="top-actions">
      <button class="btn danger" id="resetBtn">✓ 이번 주 마감 &amp; 새 주 시작</button>
      <button class="btn" id="bkSave">💾 폴더에 백업</button>
      <label class="btn">백업 불러오기<input type="file" id="bkImp" accept=".json" hidden></label>
    </div>
  </div>

  <div class="tabs" id="tabs"></div>
  <div class="panel" id="panel"></div>
</div>

<script>
const DAYS = [
  {
    id: "mon", name: "월",
    morning: [["오전", "영어 — 단어·리딩"]],
    afternoon: [
      ["오후", "Abstract·Intro·Conclusion 읽고 전체 훑기 (깊게 X)"],
      ["오후 늦게", "Paper Map 1페이지 작성"]
    ],
    outputTitle: "[Day 1] Paper Map",
    outputs: [
      "One-sentence summary — 이 논문은 __ 시장에서 __ 문제를 __ 모형/자료로 분석한다",
      "Research question — 저자들이 묻는 질문",
      "Why important — 왜 이 질문이 중요한가",
      "Market / Data — 어떤 시장과 데이터",
      "Main object — 수요? 공급? 진입? 가격? 품질? welfare?",
      "Main model — 핵심 모형",
      "Main result preview — 가장 중요한 결과",
      "Hard part — 가장 어려워 보이는 부분"
    ],
    evening: ["PDF·폴더 정리 + 내일 볼 Model section 표시"]
  },
  {
    id: "tue", name: "화",
    morning: [["오전", "영어 — 단어·리딩"]],
    afternoon: [
      ["오후", "Model section 정독 — timing·agent·choice·shock·payoff"],
      ["오후 늦게", "Model Note 1페이지 작성"]
    ],
    outputTitle: "[Day 2] Model Note",
    outputs: [
      "Agents — 누가 의사결정자인가",
      "Choices — 각 agent가 무엇을 선택하는가",
      "Timing — 의사결정 순서",
      "State variables — 상태변수",
      "Shocks — 관찰/비관찰 shock",
      "Utility / Profit / Payoff — 핵심 목적함수",
      "Equilibrium concept — Bertrand-Nash? Entry? Dynamic? Static?",
      "Key equations — 핵심 식 1~3개와 각 항의 의미",
      "My translation — 논문 식을 내 말로 설명"
    ],
    evening: ["핵심 식·notation 가볍게 정리"]
  },
  {
    id: "wed", name: "수",
    morning: [["오전", "영어 — 단어·리딩"]],
    afternoon: [
      ["오후", "Identification/Empirical strategy 정독 — 내생성·IV·variation"],
      ["오후 늦게", "Identification Note 완성"]
    ],
    outputTitle: "[Day 3] Identification Note",
    outputs: [
      "Parameter of interest — 무엇을 식별하려 하는가",
      "Why simple comparison fails — OLS가 왜 안 되는가",
      "Endogeneity problem — 내생성은 어디서 생기는가",
      "Source of variation — 저자들이 이용하는 variation",
      "Instrument / exclusion restriction — IV와 유효성 주장",
      "Identifying assumption — 핵심 식별 가정",
      "Threat — 내가 보기엔 어디가 위험한가",
      "One-paragraph identification summary"
    ],
    evening: ["세미나 질문 후보 1개 + debt list 정리"]
  },
  {
    id: "thu", name: "목",
    morning: [["오전", "영어 — 단어·리딩"]],
    afternoon: [
      ["오후", "Estimation section + 결과표 2~3개 읽고 해석"],
      ["오후 늦게", "Results Note 작성"]
    ],
    outputTitle: "[Day 4] Estimation / Results Note",
    outputs: [
      "Estimated parameters — 어떤 parameter를 추정하는가",
      "Estimation method — GMM? MLE? IV? FE? Simulation?",
      "Moments / objective — 무엇을 맞추는가",
      "Main tables — 중요한 table 2~3개 요약",
      "Magnitude — 결과가 경제적으로 큰가",
      "Robustness — 어떤 우려를 어떻게 방어하는가",
      "What I trust — 설득력 있는 결과",
      "What I do not fully trust — 덜 설득되는 결과"
    ],
    evening: ["숫자·캡처 정리 + 질문 후보 1개 추가"]
  },
  {
    id: "fri", name: "금",
    morning: [["오전", "영어 가볍게"]],
    afternoon: [
      ["오후", "월–목 노트 복습 → contribution·비판점·질문 정리"],
      ["오후 늦게", "Final Seminar Note 완성 (질문 2~3개 포함)"]
    ],
    outputTitle: "[Day 5] Final Seminar Note",
    outputs: [
      "One-sentence summary",
      "Five-sentence summary",
      "Research question",
      "Model",
      "Identification",
      "Estimation and results",
      "Contribution",
      "Counterfactual / Policy implication",
      "Strengths 2개",
      "Weaknesses 2개",
      "Toolbox debt",
      "질문 ① Clarification — 제가 이해한 바로는 __인데, 맞나요?",
      "질문 ② Identification — 핵심 variation이 __와 독립이라는 가정은 어떻게 방어되나요?",
      "질문 ③ Extension — 모형에 __를 추가하면 counterfactual이 달라질까요?"
    ],
    evening: []
  },
  {
    id: "sat", name: "토",
    morning: [["오전", "영어·논문 문장 가볍게 복습"]],
    afternoon: [
      ["오후", "Seminar Note 수정 + toolbox debt 딱 1개만"],
      ["저녁", "완전 휴식"]
    ],
    outputTitle: "[Weekly Review]",
    outputs: [
      "이번 주 논문에서 배운 IO 구조",
      "반복해서 나온 개념",
      "아직 모르는 개념",
      "다음 주에 이어갈 toolbox debt 1개",
      "다음 주 세미나 페이퍼 세팅"
    ],
    evening: []
  },
  {
    id: "sun", name: "일",
    morning: [],
    afternoon: [["30분 이내", "다음 주 논문 abstract만 읽고 PDF·비머 프로젝트 세팅"]],
    outputTitle: null,
    outputs: [],
    evening: []
  }
];

const LS_KEY = "seminarWeeklyTracker.v1";
function defState() {
  return { paperTitle: "", weekLabel: "", checks: {}, memos: {}, history: [], notes: {}, noteWeeks: [], noteFiles: {}, vocab: { gre: [], toefl: [], writing: [] }, itemTexts: {}, activeTab: null };
}
let state = defState();
try { const s = JSON.parse(localStorage.getItem(LS_KEY)); if (s && typeof s === "object") state = Object.assign(state, s); } catch (e) {}
function save() { try { localStorage.setItem(LS_KEY, JSON.stringify(state)); return true; } catch (e) { return false; } }
if (!state.vocab) state.vocab = { gre: [], toefl: [], writing: [] };
if (!state.noteFiles) state.noteFiles = {};
if (!state.itemTexts) state.itemTexts = {};
let editKey = null;

function dayItems(d) {
  const items = [];
  d.morning.forEach((x, i) => items.push({ key: d.id + ".m" + i, time: x[0], txt: x[1], sec: "morning" }));
  d.afternoon.forEach((x, i) => items.push({ key: d.id + ".a" + i, time: x[0], txt: x[1], sec: "afternoon" }));
  d.outputs.forEach((x, i) => items.push({ key: d.id + ".o" + i, time: "", txt: x, sec: "output" }));
  d.evening.forEach((x, i) => items.push({ key: d.id + ".e" + i, time: "", txt: x, sec: "evening" }));
  return items;
}
function dayProgress(d) {
  const items = dayItems(d);
  const done = items.filter(it => state.checks[it.key]).length;
  return [done, items.length];
}
function weekProgress() {
  let done = 0, total = 0;
  DAYS.forEach(d => { const [x, y] = dayProgress(d); done += x; total += y; });
  return [done, total];
}

const KOR_TODAY = ["sun","mon","tue","wed","thu","fri","sat"][new Date().getDay()];
if (!state.activeTab) state.activeTab = KOR_TODAY;

function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function renderTabs() {
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = "";
  DAYS.forEach(d => {
    const [done, total] = dayProgress(d);
    const el = document.createElement("div");
    el.className = "tab" + (state.activeTab === d.id ? " active" : "") +
      (KOR_TODAY === d.id ? " today" : "") + (total > 0 && done === total ? " done" : "");
    el.innerHTML = '<div class="d">' + d.name + '</div>' +
      '<div class="badge">' + (total ? (done === total ? "완료 ✓" : done + "/" + total) : "휴식") + '</div>';
    el.onclick = () => { state.activeTab = d.id; save(); render(); };
    tabs.appendChild(el);
  });
  const g = document.createElement("div");
  g.className = "tab" + (state.activeTab === "guide" ? " active" : "");
  g.innerHTML = '<div class="d">NOTE</div><div class="badge">누적 메모</div>';
  g.onclick = () => { state.activeTab = "guide"; save(); render(); };
  tabs.appendChild(g);
  const v = document.createElement("div");
  const nWords = state.vocab.gre.length + state.vocab.toefl.length + state.vocab.writing.length;
  v.className = "tab" + (state.activeTab === "voca" ? " active" : "");
  v.innerHTML = '<div class="d">VOCA</div><div class="badge">' + nWords + '단어</div>';
  v.onclick = () => { state.activeTab = "voca"; save(); render(); };
  tabs.appendChild(v);
}

function secHTML(title, items, cls, mkey) {
  if (!items.length) return "";
  const done = items.filter(it => state.checks[it.key]).length;
  let h = '<div class="sec ' + cls + '"><h3>' + esc(title) + ' <span class="cnt">' + done + '/' + items.length + '</span></h3>';
  items.forEach(it => {
    const ck = !!state.checks[it.key];
    const txt = state.itemTexts[it.key] || it.txt;
    if (editKey === it.key) {
      h += '<div class="item">' +
        (it.time ? '<span class="time">' + esc(it.time) + '</span>' : "") +
        '<input class="iedit-input" data-key="' + it.key + '" value="' + esc(txt) + '"></div>';
    } else {
      h += '<label class="item' + (ck ? " checked" : "") + '">' +
        '<input type="checkbox" data-key="' + it.key + '"' + (ck ? " checked" : "") + '>' +
        (it.time ? '<span class="time">' + esc(it.time) + '</span>' : "") +
        '<span class="txt">' + esc(txt) + '</span>' +
        '<button class="iedit" data-key="' + it.key + '" title="내용 수정 (비우면 기본값 복원)">✎</button></label>';
    }
  });
  if (mkey) {
    h += '<textarea class="memo secmemo" data-mkey="' + mkey + '" placeholder="메모…"' +
      ' style="min-height:48px; margin-top:6px">' + esc(state.memos[mkey] || "") + '</textarea>';
  }
  return h + "</div>";
}

function renderPanel() {
  const panel = document.getElementById("panel");
  if (state.activeTab === "guide") { renderGuide(panel); return; }
  if (state.activeTab === "voca") { renderVoca(panel); return; }
  const d = DAYS.find(x => x.id === state.activeTab) || DAYS[0];
  const items = dayItems(d);
  const bySec = s => items.filter(it => it.sec === s);
  let h = '<div class="day-head"><h2>' + d.name + '요일</h2></div>';
  h += secHTML("오전 · 영어 (연구실)", bySec("morning"), "", d.id + ".morning");
  h += secHTML(d.id === "sun" ? "가벼운 예열 (선택)" : "오후 · 논문 (도서관)", bySec("afternoon"), "", d.id + ".afternoon");
  if (d.outputTitle) h += secHTML("오늘의 산출물 — " + d.outputTitle, bySec("output"), "output", d.id + ".output");
  h += secHTML("저녁 · 연구실 (가볍게)", bySec("evening"), "evening", d.id + ".evening");
  panel.innerHTML = h;

  panel.querySelectorAll("input[type=checkbox][data-key]").forEach(cb => {
    cb.onchange = () => {
      if (cb.checked) state.checks[cb.dataset.key] = true;
      else delete state.checks[cb.dataset.key];
      save(); render();
    };
  });
  panel.querySelectorAll("textarea.secmemo").forEach(t => {

    };
  });

  if (ei) {

  }

const VCATS = [["gre", "GRE"], ["toefl", "TOEFL"], ["writing", "Writing"]];
let vcat = "gre";
let quiz = null;
let vedit = null;
let vsel = new Set();
let vsort = "new";
let vfilter = 0; // 0 = 전체, n = n일차만
let qmode = "flash";

function buildQuizChoices(it) {
  const key = quiz.mode === "mc" ? "m" : "w";
  const correct = it[key];
  let pool = Array.from(new Set(state.vocab[vcat].map(x => x[key]).filter(v => v && v !== correct)));
  for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = pool[i]; pool[i] = pool[j]; pool[j] = t; }
  const ch = [correct].concat(pool.slice(0, 3));
  for (let i = ch.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = ch[i]; ch[i] = ch[j]; ch[j] = t; }
  quiz.choices = ch; quiz.answer = ch.indexOf(correct);
}

function getVList() {
  const words = state.vocab[vcat];
  let list = words.map((it, idx) => ({ it: it, idx: idx }));
  if (vfilter > 0) list = list.filter(p => (p.it.d || 1) === vfilter);
  if (vsort === "new") list.reverse();
  else if (vsort === "dayasc") list.sort((a, b) => (a.it.d || 1) - (b.it.d || 1));
  else if (vsort === "daydesc") list.sort((a, b) => (b.it.d || 1) - (a.it.d || 1));
  else if (vsort === "abc") list.sort((a, b) => a.it.w.localeCompare(b.it.w, "en", { sensitivity: "base" }));
  else if (vsort === "wrong") list.sort((a, b) => (b.it.wrong || 0) - (a.it.wrong || 0));
  return list;
}

function csvEscape(x) { return '"' + String(x == null ? "" : x).replace(/"/g, '""') + '"'; }
async function bashCall(cmd) {
  const r = await window.cowork.callMcpTool("mcp__workspace__bash", { command: cmd });
  return ((r && r.content) || []).map(c => c.text || "").join("");
}
function hasCowork() { return !!(window.cowork && window.cowork.callMcpTool); }
function toB64(s) { return btoa(unescape(encodeURIComponent(s))); }
function fromB64(s) { return decodeURIComponent(escape(atob(s))); }

// 하루 1회 자동 로그 저장 (LOG/log-날짜.json, 최근 30개만 유지)
async function autoLog(force) {
  try {
    if (!hasCowork()) return;
    const today = new Date().toISOString().slice(0, 10);
    if (!force && state.lastLog === today) return;
    const b64 = toB64(JSON.stringify(state));
    if (b64.length > 1500000) return;
    const out = await bashCall(
      'DIR=$(ls -d /sessions/*/mnt/*Weekly* 2>/dev/null | head -1); ' +
      'if [ -n "$DIR" ]; then mkdir -p "$DIR/LOG"; ' +
      'printf %s \'' + b64 + '\' | base64 -d > "$DIR/LOG/log-' + today + '.json" && echo SAVED; ' +
      'ls -1t "$DIR/LOG"/log-*.json 2>/dev/null | tail -n +31 | while read f; do rm -f "$f" 2>/dev/null; done; fi');
    if (out.indexOf("SAVED") >= 0) { state.lastLog = today; save(); }
  } catch (e) {}
}

function catCSVString(cat) {
  const rows = [["day", "word", "meaning", "example", "example_translation", "wrong_count"]];
  state.vocab[cat].forEach(it => rows.push([it.d || 1, it.w, it.m, it.ex || "", it.ext || "", it.wrong || 0]));
  return "﻿" + rows.map(r => r.map(csvEscape).join(",")).join("\r\n");
}

async function vocaExportFolder() {
  if (!hasCowork()) { alert("폴더 연동은 Cowork 데스크톱에서만 가능. CSV 내보내기를 대신 사용해줘."); return; }
  try {
    let saved = [];
    for (const c of VCATS) {
      if (!state.vocab[c[0]].length) continue;
      const b64 = toB64(catCSVString(c[0]));
      const out = await bashCall(
        'DIR=$(ls -d /sessions/*/mnt/*Weekly* 2>/dev/null | head -1); ' +
        'if [ -n "$DIR" ]; then mkdir -p "$DIR/VOCA"; ' +
        'printf %s \'' + b64 + '\' | base64 -d > "$DIR/VOCA/voca_' + c[0] + '.csv" && echo SAVED; fi');
      if (out.indexOf("SAVED") < 0) throw new Error("쓰기 실패");
      saved.push("voca_" + c[0] + ".csv");
    }
    alert(saved.length ? "VOCA 폴더에 저장함: " + saved.join(", ") : "내보낼 단어가 없음.");
  } catch (e) { alert("폴더 내보내기 실패: " + e.message); }
}

async function vocaImportFolder() {
  if (!hasCowork()) { alert("폴더 연동은 Cowork 데스크톱에서만 가능. CSV 불러오기를 대신 사용해줘."); return; }
  try {
    const out = await bashCall(
      'DIR=$(ls -d /sessions/*/mnt/*Weekly* 2>/dev/null | head -1); ' +
      'for f in "$DIR/VOCA"/*.csv; do [ -e "$f" ] || continue; ' +
      'echo "===FILE:$(basename "$f")"; base64 < "$f"; done');
    const parts = out.split("===FILE:").slice(1);
    if (!parts.length) { alert("VOCA 폴더에 CSV 파일이 없음."); return; }
    let added = 0, files = 0;
    parts.forEach(p => {
      const nl = p.indexOf("\n");
      if (nl < 0) return;
      const fname = p.slice(0, nl).trim().toLowerCase();
      let text;
      try { text = fromB64(p.slice(nl).replace(/\s+/g, "")); } catch (e) { return; }
      const cat = fname.indexOf("gre") >= 0 ? "gre" : fname.indexOf("toefl") >= 0 ? "toefl" : fname.indexOf("writing") >= 0 ? "writing" : vcat;
      let rows = parseCSV(text.replace(/^﻿/, ""));
      if (!rows.length) return;
      files++;
      const h0 = (rows[0][0] || "").toLowerCase().trim();
      if (h0 === "day" || h0 === "일차" || h0 === "word" || h0 === "단어" || h0 === "voca") rows = rows.slice(1);
      const existing = {};
      state.vocab[cat].forEach(x => { existing[x.w.toLowerCase().trim()] = true; });
      rows.forEach(row => {
        let d = 1, off = 0;
        if (/^\s*\d+\s*$/.test(row[0] || "")) { d = parseInt(row[0]); off = 1; }
        const w = (row[off] || "").trim();
        if (!w || existing[w.toLowerCase()]) return;
        existing[w.toLowerCase()] = true;
        state.vocab[cat].push({
          d: d, w: w, m: (row[off + 1] || "").trim(),
          ex: (row[off + 2] || "").trim(), ext: (row[off + 3] || "").trim(),
          wrong: parseInt(row[off + 4]) || 0
        });
        added++;
      });
    });
    save(); render();
    alert("CSV " + files + "개 파일에서 " + added + "개 단어 추가함 (이미 있는 단어는 제외).");
  } catch (e) { alert("폴더 가져오기 실패: " + e.message); }
}

function parseCSV(text) {
  const rows = []; let row = [], cell = "", inQ = false;
  text = text.replace(/^﻿/, "");
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) {
      if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else inQ = false; }
      else cell += c;
    } else if (c === '"') inQ = true;
    else if (c === ",") { row.push(cell); cell = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(cell); cell = "";
      if (row.some(x => x.trim() !== "")) rows.push(row);
      row = [];
    } else cell += c;
  }
  row.push(cell);
  if (row.some(x => x.trim() !== "")) rows.push(row);
  return rows;
}

        '<button class="btn danger" id="vdelsel" style="flex:0 0 auto"' + (vsel.size ? "" : " disabled") + '>선택 삭제 (' + vsel.size + ')</button>' +
        '<button class="btn danger" id="vdelall" style="flex:0 0 auto">전체 삭제</button></div>';
      if (vfilter > 0 && !list.length) h += '<div class="empty">' + vfilter + '일차 단어가 없음.</div>';
    }
    list.forEach(pair => {
      const it = pair.it, idx = pair.idx;
      if (vedit === idx) {
        h += '<div class="ventry" style="background:#faf9f5;border-radius:8px"><div class="vrow">' +
          '<input id="ved" type="number" min="1" value="' + (it.d || 1) + '" style="flex:0 0 64px;min-width:64px" class="vnum">' +
          '<input id="vew" value="' + esc(it.w) + '" placeholder="단어">' +
          '<input id="vem" value="' + esc(it.m) + '" placeholder="뜻"></div>' +
          '<input id="veex" class="vlong" value="' + esc(it.ex || "") + '" placeholder="예문">' +
          '<input id="veext" class="vlong" value="' + esc(it.ext || "") + '" placeholder="예문 해석">' +
          '<div class="vrow" style="margin-top:6px">' +
          '<button class="btn" id="vesave" style="flex:0 0 auto">저장</button>' +
          '<button class="btn" id="vecancel" style="flex:0 0 auto">취소</button></div></div>';
      } else {
        h += '<div class="ventry"><div class="vtop">' +
          '<input type="checkbox" class="vselbox" data-i="' + idx + '"' + (vsel.has(idx) ? " checked" : "") + '>' +
          '<span class="vdaytag">' + (it.d || 1) + '일차</span><b>' + esc(it.w) + '</b><span class="vm">' + esc(it.m) + '</span>' +
          (it.wrong ? '<span class="vwrong">×' + it.wrong + '</span>' : "") +
          '<button class="btn vsm vedit2" data-i="' + idx + '">수정</button>' +
          '<button class="btn vsm vdel" data-i="' + idx + '">삭제</button></div>' +
          (it.ex ? '<div class="vex">' + esc(it.ex) + (it.ext ? '<br>' + esc(it.ext) : "") + '</div>' : "") +
          '</div>';
      }
    });
    h += '</div>';
  }
  panel.innerHTML = h;

  panel.querySelectorAll(".segbtn").forEach(b => {
    b.onclick = () => { vcat = b.dataset.cat; quiz = null; vedit = null; vsel = new Set(); vfilter = 0; renderPanel(); };
  });
  const vsortSel = panel.querySelector("#vsort");
  if (vsortSel) vsortSel.onchange = () => { vsort = vsortSel.value; renderPanel(); };
  const vfilterSel = panel.querySelector("#vfilter");
  if (vfilterSel) vfilterSel.onchange = () => { vfilter = parseInt(vfilterSel.value) || 0; vsel = new Set(); renderPanel(); };
  const vadd = panel.querySelector("#vadd");
  if (vadd) {
    const add = () => {
      const dnum = Math.max(1, parseInt(panel.querySelector("#vd").value) || 1);
      const w = panel.querySelector("#vw").value.trim();
      const m = panel.querySelector("#vm").value.trim();
      const ex = panel.querySelector("#vex").value.trim();
      const ext = panel.querySelector("#vext").value.trim();
      if (!w) return;
      state.vocab[vcat].push({ d: dnum, w: w, m: m, ex: ex, ext: ext, wrong: 0 });
      state.vday = dnum;
      save(); render();
      setTimeout(() => { const el = document.querySelector("#vw"); if (el) el.focus(); }, 0);
    };
    vadd.onclick = add;
    ["vd", "vw", "vm", "vex", "vext"].forEach(id => {
      panel.querySelector("#" + id).onkeydown = e => {
        if (e.key !== "Enter") return;
        if (id === "vd") panel.querySelector("#vw").focus();
        else if (id === "vw") panel.querySelector("#vm").focus();
        else add();
      };
    });
  }
  panel.querySelectorAll(".vdel").forEach(b => {
    b.onclick = () => { state.vocab[vcat].splice(+b.dataset.i, 1); vsel = new Set(); vedit = null; save(); render(); };
  });
  panel.querySelectorAll(".vselbox").forEach(cb => {
    cb.onchange = () => {
      const i = +cb.dataset.i;
      if (cb.checked) vsel.add(i); else vsel.delete(i);
      renderPanel();
    };
  });
  const vselall = panel.querySelector("#vselall");
  if (vselall) vselall.onclick = () => {
    const vis = getVList().map(p => p.idx);
    if (vis.length && vsel.size === vis.length) vsel = new Set();
    else vsel = new Set(vis);
    renderPanel();
  };
  const vdelsel = panel.querySelector("#vdelsel");
  if (vdelsel) vdelsel.onclick = () => {
    if (!vsel.size) return;
    if (!confirm("선택한 " + vsel.size + "개 단어를 삭제할까?")) return;
    state.vocab[vcat] = words.filter((_, i) => !vsel.has(i));
    vsel = new Set(); vedit = null; save(); render();
  };
  const vdelall = panel.querySelector("#vdelall");
  if (vdelall) vdelall.onclick = () => {
    if (!confirm(VCATS.find(c => c[0] === vcat)[1] + " 단어 " + words.length + "개를 전부 삭제할까? (되돌릴 수 없음)")) return;
    state.vocab[vcat] = [];
    vsel = new Set(); vedit = null; save(); render();
  };
  panel.querySelectorAll(".vedit2").forEach(b => {
    b.onclick = () => { vedit = +b.dataset.i; renderPanel(); };
  });
  const vesave = panel.querySelector("#vesave");
  if (vesave) {
    const commitEdit = () => {
      const it = state.vocab[vcat][vedit];
      if (!it) { vedit = null; renderPanel(); return; }
      const w = panel.querySelector("#vew").value.trim();
      if (!w) { alert("단어는 비울 수 없음."); return; }
      it.d = Math.max(1, parseInt(panel.querySelector("#ved").value) || 1);
      it.w = w;
      it.m = panel.querySelector("#vem").value.trim();
      it.ex = panel.querySelector("#veex").value.trim();
      it.ext = panel.querySelector("#veext").value.trim();
      vedit = null; save(); render();
    };
    vesave.onclick = commitEdit;
    ["ved", "vew", "vem", "veex", "veext"].forEach(id => {
      const el = panel.querySelector("#" + id);
      if (el) el.onkeydown = e => {
        if (e.key === "Enter") commitEdit();
        else if (e.key === "Escape") { vedit = null; renderPanel(); }
      };
    });
    panel.querySelector("#vecancel").onclick = () => { vedit = null; renderPanel(); };
  }
  const qmodeSel = panel.querySelector("#qmode");
  if (qmodeSel) qmodeSel.onchange = () => { qmode = qmodeSel.value; };
  const vtest = panel.querySelector("#vtest");
  if (vtest) vtest.onclick = () => {
    const from = Math.max(1, parseInt(panel.querySelector("#qfrom").value) || 1);
    const to = Math.max(from, parseInt(panel.querySelector("#qto").value) || from);
    const order = [];
    words.forEach((it, i) => { const dd = it.d || 1; if (dd >= from && dd <= to) order.push(i); });
    if (!order.length) { alert(from + "~" + to + "일차에 해당하는 단어가 없음."); return; }
    if (qmode !== "flash") {
      const key = qmode === "mc" ? "m" : "w";
      const uniq = new Set(words.map(x => x[key]).filter(Boolean));
      if (uniq.size < 4) { alert("4지선다는 단어장에 서로 다른 단어/뜻이 4개 이상 있어야 함."); return; }
    }
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    quiz = { mode: qmode, order: order, i: 0, show: false, right: 0, wrong: [], from: from, to: to, choices: null, picked: null };
    renderPanel();
  };
  const vcsv = panel.querySelector("#vcsv");
  if (vcsv) vcsv.onclick = () => {
    const rows = [["day", "word", "meaning", "example", "example_translation", "wrong_count"]];
    words.forEach(it => rows.push([it.d || 1, it.w, it.m, it.ex || "", it.ext || "", it.wrong || 0]));
    const csv = "﻿" + rows.map(r => r.map(csvEscape).join(",")).join("\r\n");
    const a = document.createElement("a");
    a.href = "data:text/csv;charset=utf-8," + encodeURIComponent(csv);
    a.download = "voca_" + vcat + "_" + weekStartStr() + ".csv";
    a.click();
  };
  const vfout = panel.querySelector("#vfout");
  if (vfout) vfout.onclick = vocaExportFolder;
  const vfin = panel.querySelector("#vfin");
  if (vfin) vfin.onclick = vocaImportFolder;
  const vimp = panel.querySelector("#vimp");
  if (vimp) vimp.onchange = () => {
    const file = vimp.files[0];
    if (!file) return;
    const r = new FileReader();
    r.onload = () => {
      let rows = parseCSV(r.result);
      if (!rows.length) { alert("빈 파일임."); return; }
      // 헤더 감지: 첫 행에 day/word/일차/단어 류가 있으면 스킵
      const h0 = (rows[0][0] || "").toLowerCase().trim();
      if (h0 === "day" || h0 === "일차" || h0 === "word" || h0 === "단어" || h0 === "voca") rows = rows.slice(1);
      let n = 0;
      rows.forEach(row => {
        // 첫 칸이 숫자면 [일차, 단어, 뜻, 예문, 해석], 아니면 [단어, 뜻, 예문, 해석] (일차=1)
        let d = 1, off = 0;
        if (/^\s*\d+\s*$/.test(row[0] || "")) { d = parseInt(row[0]); off = 1; }
        const w = (row[off] || "").trim();
        if (!w) return;
        state.vocab[vcat].push({
          d: d, w: w, m: (row[off + 1] || "").trim(),
          ex: (row[off + 2] || "").trim(), ext: (row[off + 3] || "").trim(),
          wrong: parseInt(row[off + 4]) || 0
        });
        n++;
      });
      save(); render();
      alert(n + "개 단어를 " + VCATS.find(c => c[0] === vcat)[1] + "에 추가함.");
    };
    r.readAsText(file);
  };
  panel.querySelectorAll(".qopt").forEach(b => {
    b.onclick = () => {
      if (quiz.picked !== null) return;
      quiz.picked = +b.dataset.ci;
      const idx = quiz.order[quiz.i];
      if (quiz.picked === quiz.answer) quiz.right++;
      else {
        words[idx].wrong = (words[idx].wrong || 0) + 1;
        quiz.wrong.push(idx);
        save();
      }
      renderPanel();
    };
  });
  const qnext = panel.querySelector("#qnext");
  if (qnext) qnext.onclick = () => { quiz.i++; quiz.choices = null; quiz.picked = null; renderPanel(); };
  const qshow = panel.querySelector("#qshow");
  if (qshow) qshow.onclick = () => { quiz.show = true; renderPanel(); };
  const qo = panel.querySelector("#qo");
  if (qo) qo.onclick = () => { quiz.right++; quiz.i++; quiz.show = false; renderPanel(); };
  const qx = panel.querySelector("#qx");
  if (qx) qx.onclick = () => {
    const idx = quiz.order[quiz.i];
    words[idx].wrong = (words[idx].wrong || 0) + 1;
    quiz.wrong.push(idx); quiz.i++; quiz.show = false; save(); renderPanel();
  };
  const qquit = panel.querySelector("#qquit");
  if (qquit) qquit.onclick = () => { quiz = null; renderPanel(); };
  const qdone = panel.querySelector("#qdone");
  if (qdone) qdone.onclick = () => { quiz = null; renderPanel(); };
}

// ================= top =================
function renderTop() {
  document.getElementById("paperTitle").value = state.paperTitle;
  document.getElementById("weekLabel").value = state.weekLabel;
  const [done, total] = weekProgress();
  const pct = total ? Math.round(done / total * 100) : 0;
  document.getElementById("weekBar").style.width = pct + "%";
  document.getElementById("weekPct").textContent = pct + "% (" + done + "/" + total + ")";
}

function render() { renderTabs(); renderPanel(); renderTop(); }

document.getElementById("paperTitle").oninput = e => { state.paperTitle = e.target.value; save(); };
document.getElementById("weekLabel").oninput = e => { state.weekLabel = e.target.value; save(); };
document.getElementById("resetBtn").onclick = () => {
  const [done, total] = weekProgress();
  const pct = total ? Math.round(done / total * 100) : 0;
  if (!confirm("이번 주를 마감하고 기록에 저장한 뒤, 체크와 섹션 메모를 초기화할까? (NOTE·VOCA는 유지됨. 달성률 " + pct + "%)")) return;
  state.history.push({
    date: new Date().toISOString().slice(0, 10),
    week: state.weekLabel, paper: state.paperTitle, pct: pct
  });
  state.checks = {}; state.memos = {}; state.paperTitle = ""; state.weekLabel = "";
  state.activeTab = "mon";
  save(); render();
  autoLog(true);
};

// ================= 백업 =================
document.getElementById("bkSave").onclick = async () => {
  const json = JSON.stringify(state);
  const fname = "tracker-backup-" + new Date().toISOString().slice(0, 10) + ".json";
  const download = () => {
    const a = document.createElement("a");
    a.href = "data:application/json;charset=utf-8," + encodeURIComponent(json);
    a.download = fname; a.click();
  };
  try {
    if (!window.cowork || !window.cowork.callMcpTool) throw new Error("no-mcp");
    const b64 = btoa(unescape(encodeURIComponent(json)));
    if (b64.length > 1500000) throw new Error("too-big");
    const cmd = 'DIR=$(ls -d /sessions/*/mnt/*Weekly* 2>/dev/null | head -1); ' +
      'if [ -z "$DIR" ]; then echo NODIR; else printf %s \'' + b64 + '\' | base64 -d > "$DIR/' + fname + '" && echo SAVED; fi';
    const r = await window.cowork.callMcpTool("mcp__workspace__bash", { command: cmd });
    let out = "";
    if (r && r.content && r.content.length) out = r.content.map(c => c.text || "").join("");
    if (out.indexOf("SAVED") >= 0) { alert("폴더에 저장됨: " + fname); return; }
    throw new Error(out || "fail");
  } catch (e) {
    download();
    alert("폴더에 바로 저장이 안 돼서 다운로드로 대체함. 받은 파일을 스터디 폴더에 옮겨줘.");
  }
};
document.getElementById("bkImp").onchange = e => {
  const file = e.target.files[0];
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    let obj;
    try { obj = JSON.parse(r.result); } catch (err) { alert("백업 파일 형식이 아님."); return; }
    if (!obj || typeof obj !== "object" || (!obj.checks && !obj.vocab && !obj.notes)) {
      alert("트래커 백업 파일이 아닌 것 같음."); return;
    }
    if (!confirm("현재 데이터를 이 백업으로 전부 덮어쓸까? (되돌릴 수 없음)")) return;
    state = Object.assign(defState(), obj);
    if (!state.vocab) state.vocab = { gre: [], toefl: [], writing: [] };
    if (!state.noteFiles) state.noteFiles = {};
    if (!state.itemTexts) state.itemTexts = {};
    save(); render();
    alert("백업을 불러옴.");
  };
  r.readAsText(file);
};

render();
autoLog();
</script>
</body>
